<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thaarai Tex | Cash on Delivery Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <header class="bg-white border-b sticky top-0 z-40 px-4 py-3 shadow-sm">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-gray-900">Thaarai Tex</h1>
        <p class="text-xs text-gray-500">Pure Quality Sarees & Textiles</p>
      </div>
      <button onclick="toggleCart()" class="relative bg-black text-white hover:bg-gray-800 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
        <span>🛒 Bag</span>
        <span id="cart-count" class="bg-emerald-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- Product Catalog -->
  <main class="max-w-5xl mx-auto p-4 sm:p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-lg font-bold text-gray-800">Latest Collections</h2>
      <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full">Cash on Delivery Available</span>
    </div>
    
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-gray-500">தயாரிப்புகள் ஏற்றப்படுகின்றன...</p>
    </div>
  </main>

  <!-- Cart / Checkout Drawer -->
  <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col p-6 overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-lg font-bold">Shopping Bag</h3>
        <button onclick="toggleCart()" class="text-gray-400 hover:text-black text-2xl font-bold">&times;</button>
      </div>

      <div id="cart-items" class="flex-1 space-y-3"></div>

      <div class="border-t pt-4 mt-4">
        <div class="flex justify-between font-bold text-base mb-4 text-gray-900">
          <span>மொத்தத் தொகை:</span>
          <span>₹<span id="cart-total">0</span></span>
        </div>

        <form id="cod-form" onsubmit="handleOrder(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">முழு பெயர்</label>
            <input type="text" id="cust-name" placeholder="உங்கள் பெயர்" required 
                   oninvalid="this.setCustomValidity('தயவுசெய்து உங்கள் முழு பெயரை உள்ளிடவும்')" 
                   oninput="this.setCustomValidity('')"
                   class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-black" />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">மொபைல் எண் (10 இலக்கம்)</label>
            <input type="tel" id="cust-phone" maxlength="10" placeholder="எ.கா: 9876543210" required 
                   pattern="[6-9][0-9]{9}"
                   oninvalid="this.setCustomValidity('சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும் (6-9ல் தொடங்க வேண்டும்)')"
                   oninput="this.setCustomValidity(''); validatePhoneUI();"
                   class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-black" />
            <p id="phone-msg" class="text-xs mt-1 hidden"></p>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">பின்கோடு (Pincode)</label>
            <input type="text" id="cust-pincode" maxlength="6" placeholder="6 இலக்க பின்கோடு" required 
                   pattern="[1-9][0-9]{5}"
                   oninvalid="this.setCustomValidity('சரியான 6 இலக்க பின்கோடை உள்ளிடவும்')"
                   oninput="this.setCustomValidity(''); handlePincodeLookup(this.value);"
                   class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-black" />
            <p id="pincode-msg" class="text-xs mt-1 text-gray-500">பின்கோடு கொடுத்ததும் ஊர் தானாக நிரப்பப்படும்</p>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">ஊர் / நகரம்</label>
              <input type="text" id="cust-city" placeholder="City" required readonly class="w-full bg-gray-100 border rounded-lg p-2.5 text-sm outline-none text-gray-600 cursor-not-allowed" />
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-700 mb-1">மாநிலம்</label>
              <input type="text" id="cust-state" placeholder="State" required readonly class="w-full bg-gray-100 border rounded-lg p-2.5 text-sm outline-none text-gray-600 cursor-not-allowed" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">வீட்டு முகவரி & தெரு பெயர் (Door No, Street)</label>
            <textarea id="cust-address" placeholder="கதவு எண், தெரு மற்றும் அடையாளப் பகுதி" required 
                      oninvalid="this.setCustomValidity('டெலிவரி முகவரியை தெளிவாக உள்ளிடவும்')"
                      oninput="this.setCustomValidity('')"
                      class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-black" rows="2"></textarea>
          </div>

          <div class="p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-800">
            💵 <b>Cash on Delivery:</b> பார்சல் கைக்கு வந்தவுடன் பணம் கொடுத்தால் போதும்.
          </div>

          <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow transition">
            Confirm Cash on Delivery Order
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hjogdvqwwbgzgwtdlrak.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gURnxsEPWoxUqqAqnEtJ_g_EmUlUgUZ";

    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let cart = [];
    let isPincodeValid = false;

    function isValidIndianPhone(phone) {
      if (!/^[6-9]\d{9}$/.test(phone)) {
        return { valid: false, msg: "சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும் (6-9ல் தொடங்க வேண்டும்)." };
      }

      // ஒரே எண் திரும்பத் திரும்ப வருவதைத் தடுத்தல் (Repeat checks)
      const uniqueDigits = new Set(phone.split('')).size;
      if (uniqueDigits <= 3) {
        return { valid: false, msg: "போலியான எண் போல உள்ளது. சரியான 10 இலக்க எண்ணை உள்ளிடவும்." };
      }

      if (phone === "9876543210" || phone === "1234567890") {
        return { valid: false, msg: "டெஸ்ட் எண்களைப் பயன்படுத்தக் கூடாது." };
      }

      return { valid: true, msg: "சரியான எண்" };
    }

    function validatePhoneUI() {
      const phoneInput = document.getElementById('cust-phone');
      const msg = document.getElementById('phone-msg');
      const phone = phoneInput.value.trim();

      if (phone.length < 10) {
        msg.classList.add('hidden');
        return;
      }

      const result = isValidIndianPhone(phone);
      msg.classList.remove('hidden');
      if (result.valid) {
        msg.innerText = "✓ எண் சரியானது";
        msg.className = "text-xs mt-1 text-emerald-600 font-medium";
      } else {
        msg.innerText = result.msg;
        msg.className = "text-xs mt-1 text-red-500 font-medium";
      }
    }

    async function handlePincodeLookup(pincode) {
      const msg = document.getElementById('pincode-msg');
      const cityInput = document.getElementById('cust-city');
      const stateInput = document.getElementById('cust-state');

      if (new Set(pincode.split('')).size <= 1) {
        isPincodeValid = false;
        msg.innerText = "தவறான பின்கோடு. சரியான 6 இலக்க பின்கோடை உள்ளிடவும்.";
        msg.className = "text-xs mt-1 text-red-500";
        cityInput.value = "";
        stateInput.value = "";
        return;
      }

      if (pincode.length === 6 && /^[1-9][0-9]{5}$/.test(pincode)) {
        msg.innerText = "பின்கோடு சரிபார்க்கப்படுகிறது...";
        msg.className = "text-xs mt-1 text-blue-600";

        try {
          const res = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
          const data = await res.json();

          if (data && data[0].Status === "Success") {
            const postOffice = data[0].PostOffice[0];
            cityInput.value = postOffice.District || postOffice.Name;
            stateInput.value = postOffice.State;
            isPincodeValid = true;

            msg.innerText = `✓ கண்டறியப்பட்டது: ${postOffice.District}, ${postOffice.State}`;
            msg.className = "text-xs mt-1 text-emerald-600 font-semibold";
          } else {
            isPincodeValid = false;
            cityInput.value = "";
            stateInput.value = "";
            msg.innerText = "❌ தவறான பின்கோடு! சரியான 6 இலக்க பின்கோடை உள்ளிடவும்.";
            msg.className = "text-xs mt-1 text-red-500 font-semibold";
          }
        } catch (err) {
          isPincodeValid = true;
          msg.innerText = "சரிபார்க்க முடியவில்லை. முகவரியை தெளிவாக உள்ளிடவும்.";
          msg.className = "text-xs mt-1 text-amber-600";
        }
      } else {
        isPincodeValid = false;
        cityInput.value = "";
        stateInput.value = "";
        msg.innerText = pincode.length > 0 ? "சரியான 6 இலக்க பின்கோடை உள்ளிடவும்" : "பின்கோடு கொடுத்ததும் ஊர் தானாக நிரப்பப்படும்";
        msg.className = "text-xs mt-1 text-gray-500";
      }
    }

    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      const { data: products, error } = await sbClient.from('products').select('*');

      if (error) {
        grid.innerHTML = `<p class="text-red-500">பிழை: ${error.message}</p>`;
        return;
      }

      if (!products || products.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 col-span-3 py-8 text-center">தயாரிப்புகள் எதுவும் இல்லை.</p>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="bg-white border rounded-xl overflow-hidden shadow-sm flex flex-col justify-between">
          <img src="${(p.images && p.images[0]) ? p.images[0] : 'https://placehold.co/400x300?text=Thaarai+Tex'}" alt="${p.name}" class="w-full h-60 object-cover bg-gray-100" />
          <div class="p-4 flex flex-col flex-1 justify-between">
            <div>
              <h3 class="font-bold text-gray-900 text-base">${p.name}</h3>
              <p class="text-xs text-gray-500 mt-1 line-clamp-2">${p.description || ''}</p>
              <div class="flex items-center justify-between mt-3">
                <span class="text-lg font-bold text-gray-900">₹${p.price}</span>
                <span class="text-xs px-2 py-0.5 rounded ${p.stock > 0 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-red-50 text-red-700'}">
                  ${p.stock > 0 ? `Stock: ${p.stock}` : 'Out of Stock'}
                </span>
              </div>
            </div>
            <div class="mt-4">
              ${p.stock > 0 
                ? `<button onclick='addToCart(${JSON.stringify(p)})' class="w-full bg-black hover:bg-gray-800 text-white py-2 rounded-lg text-sm font-medium">Add to Bag</button>`
                : `<button disabled class="w-full bg-gray-200 text-gray-400 py-2 rounded-lg text-sm font-medium cursor-not-allowed">Out of Stock</button>`}
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    function addToCart(product) {
      const existing = cart.find(i => i.id === product.id);
      if (existing) {
        if (existing.quantity < product.stock) {
          existing.quantity++;
        } else {
          alert('இருப்பில் உள்ள அதிகபட்ச அளவு சேர்க்கப்பட்டுவிட்டது.');
          return;
        }
      } else {
        cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1 });
      }
      renderCart();
      toggleCart();
    }

    function renderCart() {
      const itemsContainer = document.getElementById('cart-items');
      document.getElementById('cart-count').innerText = cart.reduce((sum, i) => sum + i.quantity, 0);
      document.getElementById('cart-total').innerText = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);

      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p class="text-sm text-gray-500 text-center py-6">உங்கள் பை காலியாக உள்ளது.</p>';
        return;
      }

      itemsContainer.innerHTML = cart.map(i => `
        <div class="flex justify-between items-center text-sm border-b pb-2">
          <div>
            <div class="font-medium text-gray-900">${i.name}</div>
            <div class="text-xs text-gray-500">₹${i.price} × ${i.quantity}</div>
          </div>
          <button onclick="removeFromCart('${i.id}')" class="text-red-500 text-xs font-semibold hover:underline">Remove</button>
        </div>
      `).join('');
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      renderCart();
    }

    async function handleOrder(e) {
      e.preventDefault();
      if (cart.length === 0) return alert('முதலில் ஒரு பொருளை பையில் சேர்க்கவும்!');

      const phone = document.getElementById('cust-phone').value.trim();
      const phoneValidation = isValidIndianPhone(phone);
      if (!phoneValidation.valid) {
        alert(phoneValidation.msg);
        document.getElementById('cust-phone').focus();
        return;
      }

      if (!isPincodeValid) {
        alert('தயவுசெய்து சரியான 6 இலக்க பின்கோடை உள்ளிடவும்.');
        document.getElementById('cust-pincode').focus();
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.innerText = 'ஆ
