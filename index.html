<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thaarai Tex | Pure Sarees & Handloom</title>
<meta name="description" content="Handloom silk and cotton sarees direct from weavers. Free delivery, Cash on Delivery.">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
<div class="bg-slate-900 text-white text-xs py-1.5 text-center">✨ இலவச டெலிவரி (Free Delivery) &amp; COD / UPI</div>
<header class="bg-white border-b sticky top-0 z-40 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <a href="#/" class="font-black text-xl uppercase text-slate-900">Thaarai Tex</a>
    <form id="sf" class="flex-1 hidden sm:block"><input id="q" placeholder="சேலைகளைத் தேடுங்கள்… Search sarees" class="w-full bg-gray-50 border rounded-full py-2 px-4 text-sm outline-none focus:border-slate-900"></form>
    <nav class="flex items-center gap-2 ml-auto text-sm">
      <a href="#/shop" class="px-3 py-2 hover:bg-gray-100 rounded-full">Shop</a>
      <a href="#/login" id="lgn" class="px-3 py-2 hover:bg-gray-100 rounded-full">👤 Login</a>
      <a href="#/account/orders" id="acc" class="px-3 py-2 bg-gray-100 rounded-full">👤 Login</a>
      <a href="#/cart" class="px-3 py-2 bg-slate-900 text-white rounded-full">🛒 <span id="cc">0</span></a>
    </nav>
  </div>
</header>
<main id="app" class="max-w-6xl mx-auto px-4 py-6 min-h-[70vh]"></main>
<footer class="bg-slate-900 text-gray-300 text-xs text-center py-6 mt-10">© Thaarai Tex · Melur, Tamil Nadu ·
  <a class="underline" id="wa" target="_blank" rel="noopener">WhatsApp support</a></footer>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow hidden z-50"></div>

<script>
/* ===== CONFIG ===== */
const SUPABASE_URL="https://hjogdvqwwbgzgwtdlrak.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_gURnxsEPWoxUqqAqnEtJ_g_EmUlUgUZ";
const WHATSAPP="919361378211"; // change to your number
const UPI_ID="thaaraitex@hdfc", UPI_NAME="Thaarai Tex"; // change to YOUR UPI ID
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const img=p=>esc(p.images?.[0]||'https://placehold.co/400x500?text=Thaarai+Tex');
const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cart=store.get('cart')||[], user=null, coupon='';
const off=p=>p.mrp>p.price?Math.round((p.mrp-p.price)/p.mrp*100):0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),2200)}
function saveCart(){store.set('cart',cart);$('#cc').textContent=cart.reduce((s,i)=>s+i.qty,0)}
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
$('#wa').href=`https://wa.me/${WHATSAPP}`;

/* ===== WISHLIST (kept on this device) ===== */
let wish=new Set(store.get('wish')||[]);
function setNav(){$('#acc').textContent='📦 Orders';const p=store.get('profile');$('#lgn').textContent=p?'👤 '+p.name.split(' ')[0]:'👤 Login';$('#lgn').href=p?'#/account/profile':'#/login'}
async function initAuth(){setNav()}
function toggleWish(id){wish.has(id)?wish.delete(id):wish.add(id);store.set('wish',[...wish]);route()}

/* ===== CART ===== */
function addCart(id,qty=1,max=10){
  const e=cart.find(i=>i.id===id);
  if(e){if(e.qty+qty>max)return toast('Max stock reached');e.qty+=qty}else cart.push({id,qty});
  saveCart();toast('Added to bag ✓');
}
async function cartLines(){
  if(!cart.length)return[];
  const {data}=await sb.from('products').select('*').in('id',cart.map(i=>i.id));
  return cart.map(i=>({...i,p:(data||[]).find(p=>p.id===i.id)})).filter(l=>l.p);
}
async function couponDiscount(sub){
  if(!coupon)return 0;
  const {data}=await sb.rpc('check_coupon',{p_code:coupon,p_subtotal:sub});
  return Number(data)||0;
}

/* ===== COMPONENTS ===== */
function card(p){
  const o=off(p);
  return `<a href="#/p/${p.id}" class="bg-white rounded-xl border overflow-hidden shadow-sm hover:shadow-md transition group block">
   <div class="relative aspect-[4/5] bg-gray-50 overflow-hidden">
    <img loading="lazy" src="${img(p)}" alt="${esc(p.name)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
    ${o?`<span class="absolute top-2 left-2 bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">${o}% OFF</span>`:''}
    <button data-w="${p.id}" class="absolute top-2 right-2 bg-white/90 p-2 rounded-full text-xs shadow">${wish.has(p.id)?'❤️':'🤍'}</button>
   </div>
   <div class="p-3"><h3 class="font-bold text-sm line-clamp-1">${esc(p.name)}</h3>
    <div class="mt-1 flex items-baseline gap-2"><b>${inr(p.price)}</b>${o?`<s class="text-xs text-gray-400">${inr(p.mrp)}</s>`:''}</div>
    <p class="text-[11px] mt-1 ${p.stock>0?(p.stock<5?'text-orange-600':'text-emerald-700'):'text-red-600'}">${p.stock>0?(p.stock<5?`Only ${p.stock} left`:'In stock'):'Out of stock'}</p>
   </div></a>`;
}
const grid=ps=>ps.length?`<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5">${ps.map(card).join('')}</div>`:'<p class="text-center text-gray-500 py-16">பொருட்கள் எதுவும் இல்லை. No products found.</p>';
const input=(id,label,extra='')=>`<label class="block text-xs font-medium mb-1">${label}<input id="${id}" ${extra} class="mt-1 w-full border rounded-lg p-2.5 text-sm outline-none focus:border-slate-900"></label>`;
const btn='bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-5 rounded-xl text-sm transition disabled:opacity-50';

/* ===== VIEWS ===== */
async function home(){
  const [{data:cats},{data:neu,error:e2},{data:deals}]=await Promise.all([
    sb.from('categories').select('*'),
    sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false}).limit(8),
    sb.from('products').select('*').eq('active',true).gt('stock',0).order('price').limit(4)]);
  if(e2)throw e2;
  app.innerHTML=`
  <section class="bg-gradient-to-r from-amber-700 via-rose-700 to-slate-900 rounded-2xl p-6 sm:p-10 text-white">
    <p class="text-xs uppercase tracking-widest text-amber-200 font-bold">நேரடி நெசவாளர் விலை</p>
    <h1 class="text-2xl sm:text-4xl font-extrabold mt-1">பாரம்பரிய பட்டு &amp; காட்டன் சேலைகள்</h1>
    <a href="#/shop" class="inline-block mt-4 bg-white text-slate-900 font-bold text-sm px-5 py-2.5 rounded-full">Shop Now →</a></section>
  <div class="flex gap-2 overflow-x-auto py-5">${(cats||[]).map(c=>`<a href="#/shop?cat=${c.id}" class="shrink-0 bg-white border rounded-full px-4 py-2 text-sm font-semibold hover:bg-slate-900 hover:text-white">${esc(c.name)}</a>`).join('')}</div>
  <h2 class="font-bold text-lg mb-3">Best Value</h2>${grid(deals||[])}
  <h2 class="font-bold text-lg mt-8 mb-3">New Arrivals</h2>${grid(neu||[])}`;
}

async function shop(params){
  const f={q:params.get('q')||'',cat:params.get('cat')||'',fabric:params.get('fabric')||'',min:params.get('min')||'',max:params.get('max')||'',sort:params.get('sort')||'new',stock:params.get('stock')||''};
  const {data:cats}=await sb.from('categories').select('*');
  let q=sb.from('products').select('*').eq('active',true);
  if(f.q)q=q.or(`name.ilike.%${f.q.replace(/[%,()]/g,'')}%,description.ilike.%${f.q.replace(/[%,()]/g,'')}%`);
  if(f.cat)q=q.eq('category_id',f.cat);
  if(f.fabric)q=q.eq('fabric',f.fabric);
  if(f.min)q=q.gte('price',+f.min);
  if(f.max)q=q.lte('price',+f.max);
  if(f.stock)q=q.gt('stock',0);
  q=f.sort==='low'?q.order('price'):f.sort==='high'?q.order('price',{ascending:false}):q.order('created_at',{ascending:false});
  const {data,error}=await q; if(error)throw error;
  const sel=(n,opts)=>`<select id="f-${n}" class="w-full border rounded-lg p-2 text-sm">${opts.map(([v,l])=>`<option value="${v}" ${f[n]===v?'selected':''}>${l}</option>`).join('')}</select>`;
  app.innerHTML=`<div class="grid md:grid-cols-[220px_1fr] gap-6">
   <aside class="bg-white border rounded-xl p-4 space-y-3 h-fit text-xs">
    <b class="text-sm">Filters</b>
    <div>Category${sel('cat',[['','All'],...(cats||[]).map(c=>[c.id,esc(c.name)])])}</div>
    <div>Fabric${sel('fabric',[['','All'],['Silk','Silk'],['Cotton','Cotton'],['Semi Silk','Semi Silk'],['Linen','Linen']])}</div>
    <div class="grid grid-cols-2 gap-2"><div>Min ₹<input id="f-min" type="number" value="${esc(f.min)}" class="w-full border rounded-lg p-2"></div><div>Max ₹<input id="f-max" type="number" value="${esc(f.max)}" class="w-full border rounded-lg p-2"></div></div>
    <div>Sort${sel('sort',[['new','Newest'],['low','Price: Low to High'],['high','Price: High to Low']])}</div>
    <label class="flex items-center gap-2"><input id="f-stock" type="checkbox" ${f.stock?'checked':''}> In stock only</label>
    <button id="apply" class="${btn} w-full !py-2">Apply</button></aside>
   <section><p class="text-xs text-gray-500 mb-3">${(data||[]).length} products${f.q?` for “${esc(f.q)}”`:''}</p>${grid(data||[])}</section></div>`;
  $('#apply').onclick=()=>{
    const p=new URLSearchParams();if(f.q)p.set('q',f.q);
    for(const k of['cat','fabric','min','max','sort']){const v=$('#f-'+k).value;if(v)p.set(k,v)}
    if($('#f-stock').checked)p.set('stock','1');
    location.hash='#/shop?'+p;
  };
}

async function product(id){
  const {data:p}=await sb.from('products').select('*').eq('id',id).maybeSingle();
  if(!p){app.innerHTML='<p class="text-center py-20">Product not found.</p>';return}
  document.title=p.name+' | Thaarai Tex';
  const [{data:rv},{data:sim}]=await Promise.all([
    sb.from('reviews').select('*').eq('product_id',id).order('created_at',{ascending:false}),
    sb.from('products').select('*').eq('active',true).eq('category_id',p.category_id).neq('id',id).limit(4)]);
  const avg=rv?.length?rv.reduce((s,r)=>s+r.rating,0)/rv.length:0;
  const rec=(store.get('recent')||[]).filter(x=>x!==id);store.set('recent',[id,...rec].slice(0,8));
  const imgs=p.images?.length?p.images:[''];
  const o=off(p), ok=p.stock>0;
  const shareUrl=encodeURIComponent(location.href), shareTxt=encodeURIComponent(p.name+' - '+inr(p.price));
  app.innerHTML=`<div class="bg-white rounded-2xl border p-4 sm:p-8 grid md:grid-cols-2 gap-8">
   <div><div class="aspect-square bg-gray-50 rounded-xl overflow-hidden border"><img id="main" src="${img(p)}" alt="${esc(p.name)}" class="w-full h-full object-cover cursor-zoom-in transition-transform duration-200"></div>
    <div class="flex gap-2 mt-3 overflow-x-auto">${imgs.map(u=>`<img src="${esc(u)}" class="thumb w-16 h-16 object-cover rounded-lg border cursor-pointer">`).join('')}</div></div>
   <div class="space-y-4">
    <h1 class="text-2xl font-bold">${esc(p.name)}</h1>
    <div class="text-sm text-amber-600">${stars(avg)} <span class="text-gray-500">(${rv?.length||0} reviews)</span></div>
    <div class="flex items-baseline gap-3"><b class="text-3xl">${inr(p.price)}</b>${o?`<s class="text-gray-400">${inr(p.mrp)}</s><span class="text-emerald-600 font-bold text-sm">${o}% off</span>`:''}</div>
    <p class="text-sm font-semibold ${ok?'text-emerald-700':'text-red-600'}">${ok?(p.stock<5?`Only ${p.stock} left`:'In stock'):'Out of stock'}</p>
    <table class="text-sm"><tbody>${[['Fabric',p.fabric],['Colour',p.color],['Occasion',p.occasion]].filter(r=>r[1]).map(r=>`<tr><td class="pr-6 py-0.5 text-gray-500">${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>
    <div class="border rounded-xl p-3 text-sm"><b>Delivery check</b>
     <div class="flex gap-2 mt-2"><input id="pin" maxlength="6" inputmode="numeric" placeholder="Pincode" class="border rounded-lg p-2 w-32 text-sm"><button id="pinb" class="bg-gray-100 px-3 rounded-lg font-semibold">Check</button></div><p id="pinr" class="text-xs mt-1"></p></div>
    <div class="grid grid-cols-3 gap-2 text-center text-[11px] font-semibold"><div>💵<br>Cash on Delivery</div><div>🚚<br>Free Delivery</div><div>🔄<br>7-day returns</div></div>
    <p class="text-sm text-gray-600 leading-relaxed">${esc(p.description||'')}</p>
    <div class="flex gap-2"><button id="add" ${ok?'':'disabled'} class="flex-1 ${btn} !bg-amber-500 hover:!bg-amber-600">Add to Bag 🛒</button><button id="buy" ${ok?'':'disabled'} class="flex-1 ${btn}">Buy Now ⚡</button></div>
    <div class="flex gap-3 text-xs"><a class="underline" target="_blank" rel="noopener" href="https://wa.me/?text=${shareTxt}%20${shareUrl}">Share on WhatsApp</a>
     <a class="underline" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('I want to order: '+p.name)}">Order via WhatsApp</a>
     <button data-w="${p.id}" class="underline">${wish.has(p.id)?'❤️ Wishlisted':'🤍 Wishlist'}</button></div>
   </div></div>
   <section class="bg-white rounded-2xl border p-5 mt-6"><h2 class="font-bold mb-3">Ratings &amp; Reviews</h2>
    ${user?`<div class="border rounded-xl p-3 mb-4 text-sm space-y-2"><select id="rr" class="border rounded p-1">${[5,4,3,2,1].map(n=>`<option>${n}</option>`)}</select> ★
     <textarea id="rb" maxlength="500" rows="2" placeholder="Write your review" class="w-full border rounded-lg p-2"></textarea><button id="rs" class="${btn} !py-2">Submit</button></div>`:''}
    ${(rv||[]).map(r=>`<div class="border-t py-3 text-sm"><span class="text-amber-600">${stars(r.rating)}</span> <b>${esc(r.author||'Customer')}</b><p class="text-gray-600">${esc(r.body)}</p></div>`).join('')||'<p class="text-sm text-gray-500">No reviews yet.</p>'}</section>
   ${sim?.length?`<h2 class="font-bold text-lg mt-8 mb-3">Similar Products</h2>${grid(sim)}`:''}`;
  const main=$('#main');
  document.querySelectorAll('.thumb').forEach(t=>t.onclick=()=>main.src=t.src);
  main.onmousemove=e=>{const r=main.getBoundingClientRect();main.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;main.style.transform='scale(2)'};
  main.onmouseleave=()=>main.style.transform='scale(1)';
  $('#pinb').onclick=()=>{const v=$('#pin').value.trim(),r=$('#pinr');
    if(!/^[1-9]\d{5}$/.test(v)){r.textContent='Enter a valid 6-digit pincode';r.className='text-xs mt-1 text-red-600';return}
    const d=new Date(Date.now()+5*864e5);r.textContent='✓ Delivery by '+d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});r.className='text-xs mt-1 text-emerald-700'};
  $('#add').onclick=()=>{addCart(p.id,1,p.stock);};
  $('#buy').onclick=()=>{addCart(p.id,1,p.stock);location.hash='#/checkout'};
  const rs=$('#rs');if(rs)rs.onclick=async()=>{
    const {data:pr}=await sb.from('profiles').select('name').eq('id',user.id).maybeSingle();
    const {error}=await sb.from('reviews').insert({product_id:id,user_id:user.id,author:pr?.name||'Customer',rating:+$('#rr').value,body:$('#rb').value.trim()});
    toast(error?'You already reviewed this':'Thanks for your review!');route()};
}

async function cartView(){
  const L=await cartLines(); cart=L.map(l=>({id:l.id,qty:Math.min(l.qty,l.p.stock||1)}));saveCart();
  if(!L.length){app.innerHTML='<div class="text-center py-20"><p class="mb-4">உங்கள் பை காலியாக உள்ளது.</p><a href="#/shop" class="'+btn+' inline-block">Continue Shopping</a></div>';return}
  const sub=L.reduce((s,l)=>s+l.p.price*l.qty,0), d=await couponDiscount(sub), ship=0;
  if(coupon&&!d)toast('Coupon not valid for this cart');
  app.innerHTML=`<div class="grid md:grid-cols-[1fr_320px] gap-6"><div class="space-y-3">${L.map(l=>`
   <div class="bg-white border rounded-xl p-3 flex gap-3"><img src="${img(l.p)}" class="w-20 h-24 object-cover rounded-lg">
    <div class="flex-1 text-sm"><a href="#/p/${l.p.id}" class="font-bold">${esc(l.p.name)}</a><div>${inr(l.p.price)}</div>
     <div class="flex items-center gap-2 mt-2"><button data-q="${l.id}" data-d="-1" class="border rounded px-2">−</button><b>${l.qty}</b><button data-q="${l.id}" data-d="1" class="border rounded px-2">+</button>
     <button data-rm="${l.id}" class="ml-3 text-red-600 text-xs">Remove</button></div></div><b>${inr(l.p.price*l.qty)}</b></div>`).join('')}</div>
   <aside class="bg-white border rounded-xl p-4 h-fit text-sm space-y-2">
    <div class="flex gap-2"><input id="cp" value="${esc(coupon)}" placeholder="Coupon code" class="border rounded-lg p-2 flex-1 uppercase"><button id="cpb" class="bg-gray-100 px-3 rounded-lg font-semibold">Apply</button></div>
    <div class="flex justify-between"><span>Subtotal</span><span>${inr(sub)}</span></div>
    <div class="flex justify-between text-emerald-700"><span>Discount</span><span>−${inr(d)}</span></div>
    <div class="flex justify-between"><span>Delivery</span><span>${ship?inr(ship):'FREE'}</span></div>
    <div class="flex justify-between font-bold text-base border-t pt-2"><span>Total</span><span>${inr(sub-d+ship)}</span></div>
    <a href="#/checkout" class="${btn} block text-center">Checkout →</a></aside></div>`;
  app.onclick=e=>{const t=e.target;
    if(t.dataset.q){const i=cart.find(x=>x.id===t.dataset.q);i.qty+=+t.dataset.d;if(i.qty<1)cart=cart.filter(x=>x!==i);saveCart();cartView()}
    if(t.dataset.rm){cart=cart.filter(x=>x.id!==t.dataset.rm);saveCart();cartView()}};
  $('#cpb').onclick=()=>{coupon=$('#cp').value.trim().toUpperCase();cartView()};
}

async function checkout(){
  const L=await cartLines(); if(!L.length){location.hash='#/cart';return}
  const sub=L.reduce((s,l)=>s+l.p.price*l.qty,0);
  let d=await couponDiscount(sub), method='COD';
  const pf=store.get('profile'), AL=getAddrs(), def=AL.find(a=>a.def)||AL[0]||store.get('addr')||{}, saved={...(pf?{name:pf.name,phone:pf.phone}:{}),...def};
  app.innerHTML=`<div class="grid md:grid-cols-[1fr_320px] gap-6">
   <form id="cf" class="bg-white border rounded-xl p-5 space-y-3">
    <h2 class="font-bold">Delivery Address</h2>
    ${AL.length?`<select id="sa" class="w-full border rounded-lg p-2.5 text-sm"><option value="">Use a saved address…</option>${AL.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} – ${esc(a.line.slice(0,30))}, ${esc(a.pincode)}</option>`).join('')}</select>`:''}
    ${input('a-name','Full name',`required value="${esc(saved.name||'')}"`)}
    ${input('a-phone','Mobile (10 digits)',`required pattern="[6-9][0-9]{9}" maxlength="10" value="${esc(saved.phone||'')}"`)}
    ${input('a-pin','Pincode',`required pattern="[1-9][0-9]{5}" maxlength="6" value="${esc(saved.pincode||'')}"`)}
    <div class="grid grid-cols-2 gap-2">${input('a-city','City / District',`required value="${esc(saved.city||'')}"`)}${input('a-state','State',`required value="${esc(saved.state||'Tamil Nadu')}"`)}</div>
    <label class="block text-xs font-medium">Door no, street, area<textarea id="a-line" required rows="2" class="mt-1 w-full border rounded-lg p-2.5 text-sm">${esc(saved.line||'')}</textarea></label>
    <h2 class="font-bold pt-2">Payment</h2>
    <label class="flex items-center gap-2 border rounded-lg p-3 text-sm cursor-pointer"><input type="radio" name="pm" value="COD" checked> 💵 Cash on Delivery</label>
    <label class="flex items-center gap-2 border rounded-lg p-3 text-sm cursor-pointer"><input type="radio" name="pm" value="UPI"> 📲 Pay Online (UPI)</label>
    <div id="upi" class="hidden border border-emerald-200 rounded-xl p-4 bg-emerald-50 text-sm space-y-3 text-center">
     <p>Pay exactly <b id="upa" class="text-lg"></b> to this UPI ID</p>
     <p class="font-mono bg-white border rounded-lg py-2 font-bold select-all">${esc(UPI_ID)}</p>
     <div id="qr" class="flex justify-center"></div>
     <a id="upl" class="${btn} inline-block !py-2">Open UPI app</a>
     <input id="utr" maxlength="22" placeholder="After paying, enter UPI transaction / UTR number" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-slate-900">
     <p class="text-xs text-gray-500">We confirm your order once the payment is verified.</p></div>
    <button id="po" class="${btn} w-full"></button></form>
   <aside class="bg-white border rounded-xl p-4 h-fit text-sm space-y-1">${L.map(l=>`<div class="flex justify-between gap-2"><span>${esc(l.p.name)} × ${l.qty}</span><span>${inr(l.p.price*l.qty)}</span></div>`).join('')}
    <div class="flex gap-2 pt-3"><input id="cp" value="${esc(coupon)}" placeholder="Coupon code" class="border rounded-lg p-2 flex-1 uppercase"><button type="button" id="cpb" class="bg-gray-100 px-3 rounded-lg font-semibold">Apply</button></div>
    <div class="flex justify-between border-t pt-2 mt-2"><span>Subtotal</span><span>${inr(sub)}</span></div>
    <div class="flex justify-between text-emerald-700"><span>Discount</span><span id="sd"></span></div>
    <div class="flex justify-between"><span>Delivery</span><span class="text-emerald-700 font-semibold">FREE</span></div>
    <div class="flex justify-between font-bold text-base border-t pt-2"><span>Total</span><span id="st"></span></div></aside></div>`;
  const refresh=()=>{
    const t=sub-d, link=`upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(UPI_NAME)}&am=${t}&cu=INR&tn=${encodeURIComponent('Thaarai Tex order')}`;
    $('#sd').textContent='−'+inr(d);$('#st').textContent=inr(t);$('#upa').textContent=inr(t);$('#upl').href=link;
    $('#po').textContent='Review Order · '+inr(t);
    $('#qr').innerHTML='';if(method==='UPI'&&window.QRCode)new QRCode($('#qr'),{text:link,width:160,height:160});
  };
  refresh();
  document.querySelectorAll('input[name=pm]').forEach(r=>r.onchange=()=>{method=r.value;
    $('#upi').classList.toggle('hidden',method!=='UPI');$('#utr').required=method==='UPI';refresh()});
  $('#cpb').onclick=async()=>{coupon=$('#cp').value.trim().toUpperCase();d=await couponDiscount(sub);
    toast(coupon?(d?'Coupon applied ✓':'Coupon not valid or minimum not met'):'Coupon removed');refresh()};
  const sa=$('#sa');if(sa)sa.onchange=()=>{const a=AL.find(x=>x.id===sa.value);if(!a)return;$('#a-name').value=a.name;$('#a-phone').value=a.phone;$('#a-pin').value=a.pincode;$('#a-city').value=a.city;$('#a-state').value=a.state;$('#a-line').value=a.line};
  $('#cf').onsubmit=e=>{e.preventDefault();
    const addr={name:$('#a-name').value.trim(),phone:$('#a-phone').value.trim(),pincode:$('#a-pin').value.trim(),city:$('#a-city').value.trim(),state:$('#a-state').value.trim(),line:$('#a-line').value.trim()};
    const utr=method==='UPI'?$('#utr').value.trim():'';
    if(method==='UPI'&&!/^[A-Za-z0-9]{8,22}$/.test(utr))return toast('Pay first, then enter the UPI transaction number');
    confirmBox(addr,utr)};
  function confirmBox(addr,utr){
    const ov=document.createElement('div');ov.className='fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4';
    ov.innerHTML=`<div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-3 max-h-[90vh] overflow-y-auto"><h3 class="font-bold text-base">Please confirm your order</h3>
     <div class="bg-gray-50 border rounded-xl p-3 text-sm space-y-1">${L.map(l=>`<div class="flex justify-between gap-2"><span>${esc(l.p.name)} × ${l.qty}</span><span>${inr(l.p.price*l.qty)}</span></div>`).join('')}</div>
     <div class="text-sm"><b>${esc(addr.name)}</b> · ${esc(addr.phone)}<br>${esc(addr.line)}, ${esc(addr.city)}, ${esc(addr.state)} - ${esc(addr.pincode)}</div>
     <div class="flex justify-between text-sm"><span>Payment</span><b>${method==='UPI'?'UPI · Ref '+esc(utr):'Cash on Delivery'}</b></div>
     <div class="flex justify-between text-sm"><span>Delivery</span><b class="text-emerald-700">FREE</b></div>
     <div class="flex justify-between font-bold text-base"><span>${method==='UPI'?'Amount paid':'Amount to pay on delivery'}</span><span>${inr(sub-d)}</span></div>
     <div class="flex gap-2 pt-1"><button id="cE" class="flex-1 border rounded-xl py-2.5 font-semibold">✏️ Edit</button><button id="cO" class="flex-1 ${btn}">✓ Confirm Order</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#cE').onclick=()=>ov.remove();
    ov.querySelector('#cO').onclick=async()=>{
      const b=ov.querySelector('#cO');b.disabled=true;b.textContent='Placing order…';
      const {data,error}=await sb.rpc('place_order_guest',{p_items:cart.map(i=>({id:i.id,qty:i.qty})),p_address:addr,p_coupon:coupon||null,p_method:method,p_ref:utr||null});
      if(error){toast(error.message);b.disabled=false;b.textContent='✓ Confirm Order';return}
      store.set('addr',addr);{const AL2=getAddrs();if(!AL2.some(x=>x.line===addr.line&&x.pincode===addr.pincode))store.set('addrs',[...AL2,{...addr,id:Date.now().toString(36),def:!AL2.length}])}
      store.set('orders',[{code:String(data).slice(0,8).toUpperCase(),phone:addr.phone},...(store.get('orders')||[])]);
      cart=[];coupon='';saveCart();ov.remove();
      app.innerHTML=`<div class="text-center py-20"><div class="text-5xl">🎉</div><h2 class="text-xl font-bold mt-3">ஆர்டர் வெற்றிகரமாகப் பதிவானது!</h2>
       <p class="text-sm text-gray-600 mt-1">Order ID #${esc(String(data).slice(0,8).toUpperCase())}${method==='UPI'?'<br>We will verify your payment shortly.':''}</p><a href="#/account/orders" class="${btn} inline-block mt-5">My Orders</a></div>`;
    };
  }
}

function loginView(){
  const p=store.get('profile');
  app.innerHTML=`<div class="max-w-sm mx-auto bg-white border rounded-2xl p-6 space-y-3">
   <h2 class="font-bold">${p?'Your details':'Login with name & mobile number'}</h2>
   <p class="text-xs text-gray-500">No password or OTP. Your details fill in the checkout form automatically.</p>
   ${input('ln','Your name',`maxlength="60" value="${esc(p?.name||'')}"`)}
   ${input('lp','Mobile number (10 digits)',`maxlength="10" inputmode="numeric" placeholder="9876543210" value="${esc(p?.phone||'')}"`)}
   <button id="go" class="${btn} w-full">${p?'Save':'Continue'}</button>
   ${p?'<button id="lo" class="w-full text-red-600 text-sm font-semibold">Logout</button>':''}</div>`;
  $('#go').onclick=()=>{
    const name=$('#ln').value.trim(), phone=$('#lp').value.trim();
    if(name.length<2)return toast('Enter your name');
    if(!/^[6-9]\d{9}$/.test(phone))return toast('Enter a valid 10-digit mobile number');
    store.set('profile',{name,phone});localStorage.removeItem('lookup');setNav();toast('Welcome, '+name.split(' ')[0]+'!');location.hash='#/'};
  const lo=$('#lo');if(lo)lo.onclick=()=>{localStorage.removeItem('profile');setNav();toast('Logged out');loginView()};
}

/* ===== ACCOUNT (full page) ===== */
let ofilter='all', addrEdit=null, OC={list:[],dev:[]};
function getAddrs(){return store.get('addrs')||[]}
const STL={pending:'bg-amber-100 text-amber-800',verified:'bg-blue-100 text-blue-800',dispatched:'bg-purple-100 text-purple-800',delivered:'bg-emerald-100 text-emerald-800',cancelled:'bg-red-100 text-red-800'};
const STEPS=['pending','verified','dispatched','delivered'], SLBL={pending:'Order placed',verified:'Confirmed',dispatched:'Shipped 🚚',delivered:'Delivered ✓',cancelled:'Cancelled'};
const GRP={all:()=>true,progress:o=>['pending','verified'].includes(o.order_status),shipped:o=>o.order_status==='dispatched',delivered:o=>o.order_status==='delivered',cancelled:o=>o.order_status==='cancelled'};

function orderCard(o){
  const at=STEPS.indexOf(o.order_status);
  return `<div class="bg-white border rounded-xl p-4 text-sm"><div class="flex justify-between items-center"><span class="text-gray-500 text-xs">Ordered ${new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span><span class="px-2 py-0.5 rounded-full text-xs font-bold ${STL[o.order_status]||''}">${esc(SLBL[o.order_status]||o.order_status)}</span></div>
   ${o.items.map(i=>`<div class="flex gap-3 items-center mt-3">${i.image?`<img src="${esc(i.image)}" class="w-12 h-14 object-cover rounded">`:'<div class="w-12 h-14 bg-gray-100 rounded"></div>'}<div class="flex-1"><p class="font-semibold">${esc(i.name)}</p><p class="text-xs text-gray-500">Qty ${i.quantity}</p></div><b>${inr(i.price*i.quantity)}</b></div>`).join('')}
   ${o.order_status==='cancelled'?'':`<div class="grid grid-cols-4 gap-1 mt-4 text-[10px] text-center text-gray-500">${['Placed','Confirmed','Shipped','Delivered'].map((l,i)=>`<div><div class="h-1.5 rounded ${i<=at?'bg-emerald-500':'bg-gray-200'} mb-1"></div>${l}</div>`).join('')}</div>`}
   <div class="flex justify-between font-bold border-t mt-3 pt-2"><span>Total</span><span>${inr(o.total)}</span></div>
   ${o.tracking_id?`<p class="text-xs mt-1">Tracking ID: <b>${esc(o.tracking_id)}</b></p>`:''}
   </div>`;
}
async function ordersHtml(pf){
  const saved=store.get('orders')||[];
  const res=await Promise.all(saved.map(x=>sb.rpc('track_order',{p_code:x.code,p_phone:x.phone})));
  const dev=res.map(r=>r.data).filter(Boolean);
  const phone=pf?.phone||store.get('lookup')||'';
  let list=[];
  if(phone){const {data}=await sb.rpc('track_orders_by_phone',{p_phone:phone});list=data||[]}
  dev.forEach(d=>{if(!list.some(o=>o.created_at===d.created_at))list.push(d)});
  list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));OC={list,dev};
  const chips=[['all','All'],['progress','In progress'],['shipped','Shipped 🚚'],['delivered','Delivered ✓'],['cancelled','Cancelled']];
  return `<h1 class="font-bold text-lg mb-3">My Orders</h1>
   ${pf?'':`<form id="tf" class="bg-white border rounded-xl p-4 flex gap-2 mb-4"><input id="tp" required maxlength="10" inputmode="numeric" placeholder="Enter mobile number to see orders" value="${esc(phone)}" class="flex-1 border rounded-lg p-2.5 text-sm"><button class="${btn} !py-2.5">Track</button></form>`}
   <div class="flex gap-2 overflow-x-auto mb-3">${chips.map(c=>`<button data-f="${c[0]}" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border ${ofilter===c[0]?'bg-slate-900 text-white':'bg-white'}">${c[1]} (${list.filter(GRP[c[0]]).length})</button>`).join('')}</div>
   <div class="space-y-3">${list.filter(GRP[ofilter]).map(orderCard).join('')||'<div class="bg-white border rounded-xl p-8 text-center text-gray-500 text-sm">No orders here yet. <a href="#/shop" class="underline font-semibold">Start shopping</a></div>'}</div>`;
}
function profileHtml(pf){
  return `<h1 class="font-bold text-lg mb-3">Profile Information</h1><div class="bg-white border rounded-xl p-5 max-w-md space-y-3">
   ${input('pn','Name',`maxlength="60" value="${esc(pf.name)}"`)}${input('pp','Mobile number',`maxlength="10" inputmode="numeric" value="${esc(pf.phone)}"`)}
   <button id="ps" class="${btn}">Save changes</button></div>`;
}
function addressesHtml(){
  const L=getAddrs(), a=addrEdit;
  return `<h1 class="font-bold text-lg mb-3">Manage Addresses</h1>
   ${a?`<div class="bg-white border rounded-xl p-5 mb-4 space-y-3 max-w-xl"><b>${a.id?'Edit':'Add new'} address</b>
     ${input('a-name','Full name',`value="${esc(a.name||'')}"`)}${input('a-phone','Mobile number',`maxlength="10" value="${esc(a.phone||store.get('profile')?.phone||'')}"`)}
     ${input('a-pin','Pincode',`maxlength="6" value="${esc(a.pincode||'')}"`)}
     <div class="grid grid-cols-2 gap-2">${input('a-city','City / District',`value="${esc(a.city||'')}"`)}${input('a-state','State',`value="${esc(a.state||'Tamil Nadu')}"`)}</div>
     <label class="block text-xs font-medium">Door no, street, area<textarea id="a-line" rows="2" class="mt-1 w-full border rounded-lg p-2.5 text-sm">${esc(a.line||'')}</textarea></label>
     <div class="flex gap-2"><button id="asv" class="${btn}">Save address</button><button id="acn" class="px-4 py-2 border rounded-lg">Cancel</button></div></div>`
   :`<button id="addA" class="mb-4 bg-white border-2 border-dashed rounded-xl w-full py-3 font-semibold text-slate-900">+ Add a new address</button>`}
   <div class="space-y-3">${L.map(x=>`<div class="bg-white border rounded-xl p-4 text-sm"><div class="flex items-center gap-2"><b>${esc(x.name)}</b><span class="text-gray-500">${esc(x.phone)}</span>${x.def?'<span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">DEFAULT</span>':''}</div>
    <p class="text-gray-600 mt-1">${esc(x.line)}, ${esc(x.city)}, ${esc(x.state)} - <b>${esc(x.pincode)}</b></p>
    <div class="mt-2 text-xs font-semibold flex gap-4"><button data-ae="${esc(x.id)}" class="underline">Edit</button><button data-ad="${esc(x.id)}" class="underline text-red-600">Delete</button>${x.def?'':`<button data-adef="${esc(x.id)}" class="underline">Set as default</button>`}</div></div>`).join('')||(a?'':'<p class="text-sm text-gray-500">No saved addresses yet. Addresses you use at checkout are saved here automatically.</p>')}</div>`;
}
async function wishHtml(){
  let wp=[];if(wish.size){const {data}=await sb.from('products').select('*').in('id',[...wish]);wp=data||[]}
  return `<h1 class="font-bold text-lg mb-3">My Wishlist (${wp.length})</h1>${wp.length?grid(wp):'<div class="bg-white border rounded-xl p-8 text-center text-gray-500 text-sm">Your wishlist is empty. Tap the 🤍 on any saree to save it.</div>'}`;
}
async function account(section){
  const pf=store.get('profile');
  if(!pf&&section!=='orders'){location.hash='#/login';return}
  const menu=[['orders','📦','My Orders'],['profile','👤','Profile Information'],['addresses','📍','Manage Addresses'],['wishlist','❤️','My Wishlist']];
  const body=section==='profile'?profileHtml(pf):section==='addresses'?addressesHtml():section==='wishlist'?await wishHtml():await ordersHtml(pf);
  app.innerHTML=`<div class="grid md:grid-cols-[260px_1fr] gap-4 items-start"><aside class="space-y-3">
   ${pf?`<div class="bg-white border rounded-xl p-4 flex items-center gap-3"><div class="w-12 h-12 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-lg">${esc(pf.name[0].toUpperCase())}</div><div><p class="text-xs text-gray-500">Hello,</p><p class="font-bold">${esc(pf.name)}</p></div></div>`:''}
   <nav class="bg-white border rounded-xl flex md:block overflow-x-auto overflow-y-hidden text-sm">${menu.map(m=>`<a href="#/account/${m[0]}" class="shrink-0 flex items-center gap-2 px-4 py-3 ${m[0]===section?'bg-slate-900 text-white':'hover:bg-gray-50'}">${m[1]} ${m[2]}</a>`).join('')}
   ${pf?'<button id="lgo" class="shrink-0 md:w-full text-left px-4 py-3 text-red-600 font-semibold">⏻ Logout</button>':''}</nav></aside>
   <section class="min-w-0">${body}</section></div>`;
  const tf=$('#tf');if(tf)tf.onsubmit=e=>{e.preventDefault();const v=$('#tp').value.trim();
    if(!/^[6-9]\d{9}$/.test(v))return toast('Enter a valid 10-digit mobile number');store.set('lookup',v);account(section)};
  app.onclick=async e=>{const t=e.target,d=t.dataset,again=()=>account(section);
    if(t.id==='lgo'){localStorage.removeItem('profile');setNav();toast('Logged out');location.hash='#/';return}
    if(d.f){ofilter=d.f;again()}
    if(t.id==='ps'){const name=$('#pn').value.trim(),phone=$('#pp').value.trim();
      if(name.length<2)return toast('Enter your name');if(!/^[6-9]\d{9}$/.test(phone))return toast('Enter a valid mobile number');
      store.set('profile',{name,phone});localStorage.removeItem('lookup');setNav();toast('Saved ✓');again()}
    if(t.id==='addA'){addrEdit={};again()}
    if(d.ae){addrEdit=getAddrs().find(x=>x.id===d.ae);again()}
    if(d.ad&&confirm('Delete this address?')){store.set('addrs',getAddrs().filter(x=>x.id!==d.ad));again()}
    if(d.adef){store.set('addrs',getAddrs().map(x=>({...x,def:x.id===d.adef})));again()}
    if(t.id==='acn'){addrEdit=null;again()}
    if(t.id==='asv'){
      const n={name:$('#a-name').value.trim(),phone:$('#a-phone').value.trim(),pincode:$('#a-pin').value.trim(),city:$('#a-city').value.trim(),state:$('#a-state').value.trim(),line:$('#a-line').value.trim()};
      if(!n.name||!n.city||!n.state||!n.line)return toast('Please fill all fields');
      if(!/^[6-9]\d{9}$/.test(n.phone))return toast('Enter a valid mobile number');
      if(!/^[1-9]\d{5}$/.test(n.pincode))return toast('Enter a valid 6-digit pincode');
      let L=getAddrs();
      if(addrEdit.id){n.id=addrEdit.id;n.def=addrEdit.def;L=L.map(x=>x.id===n.id?n:x)}else{n.id=Date.now().toString(36);n.def=!L.length;L.push(n)}
      store.set('addrs',L);addrEdit=null;toast('Address saved ✓');again()}
  };
}

/* ===== ROUTER ===== */
async function route(){
  app.onclick=null;document.title='Thaarai Tex | Pure Sarees & Handloom';
  const [path,qs]=(location.hash||'#/').slice(1).split('?'), params=new URLSearchParams(qs||'');
  app.innerHTML='<p class="text-center text-gray-500 py-20">ஏற்றப்படுகிறது…</p>';
  try{
    if(path==='/'||path==='')await home();
    else if(path==='/shop')await shop(params);
    else if(path.startsWith('/p/'))await product(path.slice(3));
    else if(path==='/cart')await cartView();
    else if(path==='/checkout')await checkout();
    else if(path.startsWith('/account'))await account(path.split('/')[2]||'orders');
    else if(path==='/login')loginView();
    else app.innerHTML='<p class="text-center py-20">Page not found.</p>';
  }catch(err){console.error(err);app.innerHTML='<p class="text-center text-red-600 py-20">Error: '+esc(err.message||err)+'</p>'}
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b){e.preventDefault();e.stopPropagation();toggleWish(b.dataset.w)}},true);
$('#sf').onsubmit=e=>{e.preventDefault();location.hash='#/shop?q='+encodeURIComponent($('#q').value.trim())};
window.addEventListener('hashchange',route);
saveCart();initAuth().then(route);
</script>
