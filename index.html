  if(!s) return 'TT-1001';
  if(/^TT-[A-Z0-9]+$/i.test(s)) return s.toUpperCase();
  if(/^\d+$/.test(s)) return 'TT-' + String(1000 + Number(s));
  const clean = s.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
  return 'TT-' + (clean.slice(0, 6) || 'ITEM');
}

function showNeonLoader(){
  const el = $('#neon-loader');
  const num = $('#neon-counter-num');
  if(!el || !num) return;
  document.documentElement.classList.add('overflow-hidden');
  document.body.classList.add('overflow-hidden', 'touch-none');
  applyLoaderTheme();
  if(_neonTimer) clearInterval(_neonTimer);
  _neonProgress = Math.floor(Math.random() * 8) + 12; // Start quickly around 12-20%
  num.textContent = _neonProgress;
  el.style.visibility = 'visible';
  el.classList.remove('opacity-0', 'pointer-events-none');
  el.classList.add('opacity-100');

  _neonTimer = setInterval(() => {
    if(_neonProgress < 90){
      _neonProgress += Math.floor(Math.random() * 12) + 6;
      if(_neonProgress > 92) _neonProgress = 92;
      num.textContent = _neonProgress;
    }
  }, 70);
}

function hideNeonLoader(){
  const el = $('#neon-loader');
  const num = $('#neon-counter-num');
  if(!el || !num) return;
  if(_neonTimer) clearInterval(_neonTimer);
  _neonProgress = 100;
  num.textContent = '100';

  setTimeout(() => {
    document.documentElement.classList.remove('overflow-hidden');
    document.body.classList.remove('overflow-hidden', 'touch-none');
    el.classList.remove('opacity-100');
    el.classList.add('opacity-0', 'pointer-events-none');
    setTimeout(() => {
      if(el.classList.contains('opacity-0')){
        el.style.visibility = 'hidden';
      }
    }, 220);
  }, 120);

let _oauthUserPromise = null;
async function resolveOAuthUser(){
  if(!sb) return null;
  // If explicitly logged out and no OAuth is in flight, do not revive old session
  if(localStorage.getItem('tt_logged_out') === '1' && !localStorage.getItem('tt_oauth_in_flight') && !sessionStorage.getItem('tt_oauth_pending') && !_incomingOAuthCode){
    return null;
  }

  if(_oauthUserPromise) return _oauthUserPromise;

  _oauthUserPromise = (async () => {
    try {
      // 1. Check if active session already exists in Supabase
      try {
        const { data: s } = await sb.auth.getSession();
        if(s?.session?.user) return s.session.user;
      } catch(e){}

      // 2. If PKCE code exists, explicitly exchange it
      const code = _incomingOAuthCode || new URLSearchParams(window.location.search || '').get('code');
      if(code){
        try {
          const { data, error } = await sb.auth.exchangeCodeForSession(code);
          if(data?.user) return data.user;
          if(data?.session?.user) return data.session.user;
        } catch(err){
          console.warn('exchangeCodeForSession info:', err);
        }
      }

      // 3. Poll for up to 3.5s for session detection by Supabase client
      for(let i = 0; i < 14; i++){
        try {
          const { data: s } = await sb.auth.getSession();
          if(s?.session?.user) return s.session.user;
          const { data: u } = await sb.auth.getUser();
          if(u?.user) return u.user;
        } catch(e){}

        for(let key of Object.keys(localStorage)){
          if(key.startsWith('sb-') && key.endsWith('-auth-token')){
            try {
              const parsed = JSON.parse(localStorage.getItem(key));
              if(parsed?.user) return parsed.user;
            } catch(e){}
          }
        }
        await new Promise(r => setTimeout(r, 250));
      }

      // 4. Final session checks
      const { data: sData } = await sb.auth.getSession();
      if(sData?.session?.user) return sData.session.user;
      const { data: uData } = await sb.auth.getUser();
      if(uData?.user) return uData.user;
    } catch(e){
      console.warn('resolveOAuthUser error:', e);
    }
    return null;
  })();

  return _oauthUserPromise;
}

async function cartLines(){
  if(!cart.length)return[];
  try{
    if(sb){
      const {data}=await sb.from('products').select('*').in('id',cart.map(i=>i.id));
      return cart.map(i=>({...i,p:(data||[]).find(p=>p.id===i.id)})).filter(l=>l.p);
    }
  }catch{}
  return [];
}
async function couponDiscount(sub){
  if(!coupon || !sb)return 0;
  try{
    const {data, error}=await sb.rpc('check_coupon',{p_code:coupon,p_subtotal:sub});
    if(!error && Number(data)>0) return Number(data);
  }catch(e){}
  try{
    const {data, error}=await sb.from('coupons').select('*').ilike('code',coupon).eq('active',true).maybeSingle();
    if(!error && data){
      const minTotal = Number(data.min_total || data.minimum_order || 0);
      if(sub >= minTotal){
        const pct = Number(data.percent || data.discount_percent || data.discount || 0);
        if(pct > 0){
          return Math.round((sub * pct) / 100);
        }
      }
    }
  }catch(e){}
  return 0;
}

let cachedCats = null;
let cachedFeatured = null;

async function shop(params){
  const $$ = s => Array.from(document.querySelectorAll(s));

  const f = {
    q: params.get('q') || '',
    cat: params.get('cat') || '',
    fabric: params.get('fabric') || '',
    rating: params.get('rating') || '',
    min: params.get('min') || '',
    max: params.get('max') || '',
    sort: params.get('sort') || 'new',
    stock: params.get('stock') || '',
    color: params.get('color') || ''
  };

  let cats = cachedCats || [];
  if(!cachedCats && sb){
    try {
      const res = await sb.from('categories').select('*').order('name');
      cachedCats = res.data || [];
      cats = cachedCats;
    } catch(e){}
  }

  let q = sb ? sb.from('products').select('*').eq('active', true) : null;
  let data = [];
  if(q){
    if(f.q) q = q.or(`name.ilike.%${f.q.replace(/[%,()]/g,'')}%,description.ilike.%${f.q.replace(/[%,()]/g,'')}%`);
    
    // OR condition for categories / fabrics combinations when user selects multiple options
    const catList = (f.cat && f.cat !== 'All Categories' && f.cat !== 'all') ? f.cat.split(',').map(s=>s.trim()).filter(Boolean) : [];
    const fabList = (f.fabric && f.fabric !== 'All Fabrics' && f.fabric !== 'all') ? f.fabric.split(',').map(s=>s.trim()).filter(Boolean) : [];

    if(catList.length > 0 || fabList.length > 0){
      const orClauses = [];
      
      // Category conditions (OR)
      catList.forEach(cVal => {
        const cleanVal = cVal.replace(/[-_]/g, ' ').replace(/[%,()]/g, '').trim();
        const matchedCat = cats.find(c => String(c.id) === String(cVal) || (c.name && c.name.toLowerCase() === cleanVal.toLowerCase()) || (c.slug && c.slug.toLowerCase() === cVal.toLowerCase()));
        if(matchedCat && matchedCat.id && !isNaN(Number(matchedCat.id))){
          orClauses.push(`category_id.eq.${matchedCat.id}`);
        } else if(!isNaN(Number(cVal))){
          orClauses.push(`category_id.eq.${cVal}`);
        }
        if(cleanVal){
          orClauses.push(`fabric.ilike.%${cleanVal}%`);
          orClauses.push(`name.ilike.%${cleanVal}%`);
          orClauses.push(`description.ilike.%${cleanVal}%`);
        }
      });

      // Fabric conditions (OR)
      fabList.forEach(fb => {
        const cleanFb = fb.replace(/[%,()]/g, '').trim();
        if(cleanFb){
          orClauses.push(`fabric.ilike.%${cleanFb}%`);
          orClauses.push(`name.ilike.%${cleanFb}%`);
        }
      });

      if(orClauses.length){
        q = q.or(orClauses.join(','));
      }
    }
    if(f.color){
      const colList = f.color.split(',').map(s=>s.trim()).filter(Boolean);
      if(colList.length === 1) q = q.ilike('color', `%${colList[0]}%`);
      else if(colList.length > 1) q = q.or(colList.map(cl => `color.ilike.%${cl.replace(/[%,()]/g,'')}%`).join(','));
    }
    if(f.min) q = q.gte('price', +f.min);
    if(f.max) q = q.lte('price', +f.max);
    if(f.stock) q = q.gt('stock', 0);

    if(f.sort === 'low') q = q.order('price');
    else if(f.sort === 'high') q = q.order('price', {ascending: false});
    else if(f.sort === 'discount') q = q.order('mrp', {ascending: false});
    else q = q.order('created_at', {ascending: false});

    try {
      const res = await q;
      data = res.data || [];
    } catch(err){
      try {
        const fallbackRes = await sb.from('products').select('*').eq('active', true);
        data = fallbackRes.data || [];
      } catch(e2){}
    }
  }

  // Client-side ratings & custom sorting/filtering
  let ratingsMap = {};
  try {
    if(sb && (f.rating || f.sort === 'rating')){
      const { data: revData } = await sb.from('reviews').select('product_id, rating');
      if(revData && revData.length > 0){
        const counts = {}, sums = {};
        revData.forEach(r => {
          counts[r.product_id] = (counts[r.product_id] || 0) + 1;
          sums[r.product_id] = (sums[r.product_id] || 0) + (r.rating || 0);
        });
        Object.keys(counts).forEach(pid => {
          ratingsMap[pid] = sums[pid] / counts[pid];
        });
      }
    }
  } catch(e){}

  if(f.rating){
    const minR = Number(f.rating);
    if(minR > 0){
      data = data.filter(p => {
        const r = ratingsMap[p.id] !== undefined ? ratingsMap[p.id] : (p.rating ? Number(p.rating) : 4.5);
        return r >= minR;
      });
    }
  }

  if(f.sort === 'rating'){
    data.sort((a,b) => {
      const rA = ratingsMap[a.id] !== undefined ? ratingsMap[a.id] : (a.rating ? Number(a.rating) : 4.5);
      const rB = ratingsMap[b.id] !== undefined ? ratingsMap[b.id] : (b.rating ? Number(b.rating) : 4.5);
      return rB - rA;
    });
  } else if(f.sort === 'discount'){
    data.sort((a,b) => {
      const dA = a.mrp && a.price ? (a.mrp - a.price) / a.mrp : 0;
      const dB = b.mrp && b.price ? (b.mrp - b.price) / b.mrp : 0;
      return dB - dA;
    });
  }

  // Standard category options
  const defaultCats = [
    { id: '', name: 'All Categories' },
    { id: 'Cotton', name: 'Cotton' },
    { id: 'Silk', name: 'Silk' },
    { id: 'Poonam', name: 'Poonam' },
    { id: 'Soft Silk', name: 'Soft Silk' },
    { id: 'Pure Silk', name: 'Pure Silk' },

        <div class="sticky bottom-0 bg-white px-5 pt-3 pb-[calc(1.5rem+env(safe-area-inset-bottom,0px))] border-t border-gray-100 shrink-0 z-20 shadow-[0_-6px_25px_rgba(0,0,0,0.08)]">
          <button id="sort-page-apply" type="button" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-extrabold py-3.5 rounded-full text-xs sm:text-sm tracking-wide shadow-soft transition active:scale-95">Apply Sorting</button>
        </div>
      </div>
    </div>

    <!-- Product Listing Grid -->
    <section class="min-w-0 pt-2">
      <div class="flex items-center justify-between mb-4 px-1">
        <p class="text-xs font-semibold text-gray-500">Showing <span class="text-gray-900 font-extrabold">${data.length}</span> sarees${f.q ? ` for "<span class="text-gray-900">${esc(f.q)}</span>"` : ''}</p>
      </div>
      ${grid(data)}
    </section>
  </div>`;

  // Open / Close Split Filter Page Modal with total background scroll lock
  // Open / Close Split Filter Page Modal with total background scroll lock
  const openFilters = () => {
    $('#fl').classList.remove('hidden');
    document.documentElement.classList.add('overflow-hidden');
    document.body.classList.add('overflow-hidden', 'touch-none');
    try {
      history.pushState({ thaaraiModal: 'filter' }, '', location.href);
    } catch(e){}
  };
  const closeFilters = (fromPop = false) => {
    if($('#fl').classList.contains('hidden')) return;
    $('#fl').classList.add('hidden');
    document.documentElement.classList.remove('overflow-hidden');
    document.body.classList.remove('overflow-hidden', 'touch-none');
    if(!fromPop && history.state && history.state.thaaraiModal === 'filter'){
      history.back();
    }
  };
  $('#ftg').onclick = openFilters;
  $('#filter-close').onclick = () => closeFilters();

  // Separate Sort Page Modal Open / Close with total background scroll lock
  const openSortPage = () => {
    $('#sort-page-modal').classList.remove('hidden');
    document.documentElement.classList.add('overflow-hidden');
    document.body.classList.add('overflow-hidden', 'touch-none');
    try {
      history.pushState({ thaaraiModal: 'sort' }, '', location.href);
    } catch(e){}
  };
  const closeSortPage = (fromPop = false) => {
    if($('#sort-page-modal').classList.contains('hidden')) return;
    $('#sort-page-modal').classList.add('hidden');
    document.documentElement.classList.remove('overflow-hidden');
    document.body.classList.remove('overflow-hidden', 'touch-none');
    if(!fromPop && history.state && history.state.thaaraiModal === 'sort'){
      history.back();
    }
  };
  $('#sort-open').onclick = openSortPage;
  $('#sort-page-back').onclick = () => closeSortPage();

  // Pending filter states
  let pendingCat = f.cat;
  let pendingFabric = f.fabric;
  let pendingRating = f.rating;
  let pendingMin = f.min;
  let pendingMax = f.max;
  let pendingStock = f.stock;
  let pendingColor = f.color;
  let pendingSort = f.sort;

  // Flipkart/Amazon style Left Sidebar Tab Switching
  $$('.f-nav-item').forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      const tabName = btn.dataset.tab;
      
      // Update sidebar tab item styles
      $$('.f-nav-item').forEach(item => {
        item.className = 'f-nav-item w-full flex items-center justify-between px-3.5 py-4 text-left font-semibold text-sm transition border-l-4 border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-100/60';
      });
      btn.className = 'f-nav-item w-full flex items-center justify-between px-3.5 py-4 text-left font-bold text-sm transition border-l-4 border-slate-900 bg-white text-slate-950 shadow-sm';

      // Switch right panel view
      $$('.f-tab-panel').forEach(panel => panel.classList.add('hidden'));
      const activePanel = $(`#tab-panel-${tabName}`);
      if(activePanel) activePanel.classList.remove('hidden');
    };
  });

  // Helper function to update option row UI with crisp box styling
  const updateOptionRowUI = (containerId, selectedVal, isMulti = false) => {
    const panel = $(containerId);
    if(!panel) return;
    const selArray = isMulti ? String(selectedVal || '').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean) : [(selectedVal || '').toLowerCase()];
    panel.querySelectorAll('.f-opt-row').forEach(row => {
      const rVal = (row.dataset.val || '').toLowerCase();
      const isSelected = isMulti ? (!selArray.length && !rVal) || (rVal && selArray.includes(rVal)) : (rVal === (selectedVal || '').toLowerCase());
      const input = row.querySelector('input');
      const check = row.querySelector('.f-check');
      if(input) input.checked = isSelected;
      if(isSelected){
        row.className = 'f-opt-row flex items-center justify-between p-3.5 rounded-2xl border-2 cursor-pointer transition border-slate-900 bg-slate-900 text-white font-bold shadow-sm';
        if(check){
          check.className = 'f-check w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 border-white bg-white text-slate-900 font-black text-xs';
          check.textContent = '✓';
        }
      } else {
        row.className = 'f-opt-row flex items-center justify-between p-3.5 rounded-2xl border-2 cursor-pointer transition border-gray-200 bg-white text-slate-800 font-semibold hover:border-gray-300';
        if(check){
          check.className = 'f-check w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 border-gray-300 bg-white';
          check.textContent = '';
        }
      }
    });
  };

  const updateBadge = (badgeId, hasVal) => {
    const el = $(badgeId);
    if(!el) return;
    if(hasVal){
      el.classList.remove('hidden');
    } else {
      el.classList.add('hidden');
    }
  };

  const toggleMultiVal = (currentStr, val) => {
    if(!val) return ''; // clicked All -> clear all selections
    let arr = String(currentStr || '').split(',').map(s=>s.trim()).filter(Boolean);
    const idx = arr.findIndex(x => x.toLowerCase() === val.toLowerCase());
    if(idx >= 0){
      arr.splice(idx, 1);
    } else {
      arr.push(val);
    }
    return arr.join(',');
  };

  // Option row click handlers
  $$('#fl .f-opt-row').forEach(row => {
    row.onclick = (e) => {
      e.preventDefault(); // prevent native label double trigger on child input
      const type = row.dataset.type;
      const val = row.dataset.val;
      if(type === 'cat'){
        pendingCat = toggleMultiVal(pendingCat, val);
        updateOptionRowUI('#tab-panel-categories', pendingCat, true);
        updateBadge('#badge-categories', !!pendingCat);
      } else if(type === 'fabric'){
        pendingFabric = toggleMultiVal(pendingFabric, val);
        updateOptionRowUI('#tab-panel-fabric', pendingFabric, true);
        updateBadge('#badge-fabric', !!pendingFabric);
      } else if(type === 'rating'){
        pendingRating = val;
        updateOptionRowUI('#tab-panel-ratings', val);
        updateBadge('#badge-ratings', !!val);
      } else if(type === 'stock'){
        pendingStock = val;
        updateOptionRowUI('#tab-panel-availability', val);
        updateBadge('#badge-availability', !!val);
      } else if(type === 'color'){
        pendingColor = toggleMultiVal(pendingColor, val);
        updateOptionRowUI('#tab-panel-colour', pendingColor, true);
        updateBadge('#badge-colour', !!pendingColor);
      } else if(type === 'sort'){
        pendingSort = val;
        updateOptionRowUI('#tab-panel-sort', val);
        updateBadge('#badge-sort', (val && val !== 'new'));
        syncSortPageModalUI(val);
      }
    };
  });

  // Price presets
  $$('.price-tier-btn').forEach(btn => {
    btn.onclick = () => {
      const minV = btn.dataset.min || '';
      const maxV = btn.dataset.max || '';
      $('#f-min').value = minV;
      $('#f-max').value = maxV;
      pendingMin = minV;
      pendingMax = maxV;
      $$('.price-tier-btn').forEach(b => {
        b.className = 'price-tier-btn w-full flex items-center justify-between p-3.5 rounded-2xl border-2 border-gray-200 bg-white text-slate-800 hover:border-gray-300 text-left text-sm font-semibold transition';
        const span = b.querySelector('span:last-child');
        if(span) span.className = 'text-xs text-gray-400 font-bold';
      });
      btn.className = 'price-tier-btn w-full flex items-center justify-between p-3.5 rounded-2xl border-2 border-slate-900 bg-slate-900 text-white font-bold shadow-sm text-left text-sm transition';
      const lastSpan = btn.querySelector('span:last-child');
      if(lastSpan) lastSpan.className = 'text-xs text-white font-bold';
      updateBadge('#badge-price', !!(minV || maxV));
    };
  });

  $('#f-min').oninput = (e) => {
    pendingMin = e.target.value.trim();
    updateBadge('#badge-price', !!(pendingMin || pendingMax));
  };
  $('#f-max').oninput = (e) => {
    pendingMax = e.target.value.trim();
    updateBadge('#badge-price', !!(pendingMin || pendingMax));
  };

  // Sync separate sort page modal UI
  const syncSortPageModalUI = (val) => {
    $$('#sort-page-options .sort-page-card').forEach(card => {
      const isSelected = (card.dataset.sort === val);
      const radio = card.querySelector('input');
      const radioOuter = card.querySelector('.sort-page-radio-outer');
      const dot = card.querySelector('.sort-page-radio-outer > div');
      if(radio) radio.checked = isSelected;
      if(isSelected){
        card.className = 'sort-page-card flex items-center justify-between p-4 rounded-2xl border-2 cursor-pointer transition border-slate-900 bg-slate-100 shadow-sm';
        if(radioOuter) radioOuter.className = 'sort-page-radio-outer w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 border-slate-900 bg-slate-900';
        if(dot) dot.className = 'w-2 h-2 rounded-full bg-white transition-transform scale-100';
      } else {
        card.className = 'sort-page-card flex items-center justify-between p-4 rounded-2xl border-2 cursor-pointer transition border-gray-200 bg-white hover:border-gray-300';
        if(radioOuter) radioOuter.className = 'sort-page-radio-outer w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 border-gray-300 bg-white';
        if(dot) dot.className = 'w-2 h-2 rounded-full bg-white transition-transform scale-0';
      }
    });
  };

  // Sort Page Option Click
  $$('#sort-page-options .sort-page-card').forEach(card => {
    card.onclick = () => {
      const val = card.dataset.sort;
      pendingSort = val;
      syncSortPageModalUI(val);
      updateOptionRowUI('#tab-panel-sort', val);
      updateBadge('#badge-sort', (val && val !== 'new'));
    };
  });

  // Sort Page Apply & Reset
  $('#sort-page-apply').onclick = () => {
    closeSortPage();
    executeFilter();
  };
  $('#sort-page-reset').onclick = () => {
    pendingSort = 'new';
    syncSortPageModalUI('new');
    updateOptionRowUI('#tab-panel-sort', 'new');
    updateBadge('#badge-sort', false);
  };

  const executeFilter = () => {
    isLinkNavigation = true;
    setTimeout(() => { isLinkNavigation = false; }, 600);
    const p = new URLSearchParams();
    if(f.q) p.set('q', f.q);
    if(pendingCat) p.set('cat', pendingCat);
    if(pendingFabric) p.set('fabric', pendingFabric);
    if(pendingRating) p.set('rating', pendingRating);
    const minv = $('#f-min')?.value.trim() || pendingMin;
    const maxv = $('#f-max')?.value.trim() || pendingMax;
    if(minv) p.set('min', minv);
    if(maxv) p.set('max', maxv);
    if(pendingStock) p.set('stock', pendingStock);
    if(pendingColor) p.set('color', pendingColor);
    if(pendingSort && pendingSort !== 'new') p.set('sort', pendingSort);
    location.hash = '#/shop' + (p.toString() ? '?' + p.toString() : '');
  };

  $('#apply').onclick = () => {
    closeFilters();
    executeFilter();
  };
  $('#f-clear-btn').onclick = () => {
    closeFilters();
    location.hash = '#/shop';
  };
  $('#f-reset').onclick = () => {
    closeFilters();
    location.hash = '#/shop';
  };
}

        <div class="truncate max-w-[200px] sm:max-w-md">
          <span class="text-xs sm:text-sm font-bold tracking-wide block truncate">${esc(p.name)}</span>
          <span id="lb-counter" class="text-[10px] text-gray-400 font-semibold block">1 / ${imgs.length}</span>
        </div>
      </div>
      <button id="close-lightbox" aria-label="Close" class="w-10 h-10 rounded-full bg-white/10 active:bg-white/30 hover:bg-white/20 flex items-center justify-center text-white text-2xl font-light transition">&times;</button>
    </div>

    <!-- Main Zoomable Image Stage -->
    <div id="lb-stage" class="flex-1 flex items-center justify-center overflow-hidden p-2 relative my-auto">
      <img id="lightbox-img" src="${esc(imgs[0])}" alt="" class="max-w-full max-h-[72vh] sm:max-h-[75vh] object-contain rounded-xl select-none transition-transform duration-100 ease-out cursor-default">
    </div>

    <!-- Bottom Thumbnail Carousel List & Hint -->
    <div class="shrink-0 space-y-2 pb-[max(0.75rem,env(safe-area-inset-bottom,0px))] z-10">
      <p class="text-center text-gray-400 text-[11px] font-medium tracking-wide">Tap outside image to close</p>
      ${imgs.length > 1 ? `
        <div id="lb-thumbs" class="flex items-center justify-center gap-2.5 overflow-x-auto py-1 px-4 no-scrollbar">
          ${imgs.map((u, idx) => `
            <div data-idx="${idx}" class="lb-thumb-btn relative w-12 h-16 sm:w-14 sm:h-18 rounded-xl overflow-hidden cursor-pointer border-2 transition-all shrink-0 ${idx === 0 ? 'border-white scale-105 shadow-md opacity-100' : 'border-white/20 opacity-50 hover:opacity-100'}">
              <img src="${esc(u)}" alt="" class="w-full h-full object-cover pointer-events-none">
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  </div>`;

  const mainImg=$('#main-product-img'), stage=$('#zoom-stage'), thumbs=document.querySelectorAll('.thumb-btn');
  let cur=0,stageScale=1;
  function switchImage(i){
    cur=(i+imgs.length)%imgs.length;
    mainImg.src=imgs[cur];
    resetStageZoom();
    thumbs.forEach((t,k)=>{
      t.classList.toggle('border-slate-900',k===cur);
      t.classList.toggle('shadow-md',k===cur);
      t.classList.toggle('border-gray-200',k!==cur);
      t.classList.toggle('opacity-70',k!==cur);
    });
    updateLightboxUI();
  }
  thumbs.forEach(t=>t.onclick=(e)=>{e.stopPropagation();switchImage(Number(t.dataset.idx))});
  if($('#img-prev'))$('#img-prev').onclick=(e)=>{e.stopPropagation();switchImage(cur-1)};
  if($('#img-next'))$('#img-next').onclick=(e)=>{e.stopPropagation();switchImage(cur+1)};

  let x0=null;
  stage.addEventListener('touchstart',e=>{x0=e.touches.length===1&&stageScale===1?e.touches[0].clientX:null},{passive:true});
  stage.addEventListener('touchend',e=>{
    if(e.touches.length||x0===null){x0=null;return}
    const dx=e.changedTouches[0].clientX-x0;
    if(stageScale===1&&imgs.length>1&&Math.abs(dx)>40)switchImage(cur+(dx<0?1:-1));
    x0=null;
  });

  const attachPinchZoom=(surface,img,onScale=()=>{})=>{
    let startDistance=0,startScale=1,scale=1,offsetX=0,offsetY=0,dragStart=null,baseX=0,baseY=0;
    const distance=touches=>Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
    const render=()=>{img.style.transform=`translate(${offsetX}px, ${offsetY}px) scale(${scale})`;onScale(scale)};
    surface.addEventListener('touchstart',e=>{
      if(e.touches.length===2){startDistance=distance(e.touches);startScale=scale;dragStart=null}
      else if(e.touches.length===1&&scale>1){dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY};baseX=offsetX;baseY=offsetY}
    },{passive:true});
    surface.addEventListener('touchmove',e=>{
      const rect=surface.getBoundingClientRect();
      if(e.touches.length===2&&startDistance){
        e.preventDefault();
        scale=Math.max(1,Math.min(4,startScale*distance(e.touches)/startDistance));
        const maxX=rect.width*(scale-1)/2,maxY=rect.height*(scale-1)/2;
        offsetX=Math.max(-maxX,Math.min(maxX,offsetX));
        offsetY=Math.max(-maxY,Math.min(maxY,offsetY));
        render();
      }
      else if(e.touches.length===1&&dragStart&&scale>1){
        e.preventDefault();
        const maxX=rect.width*(scale-1)/2,maxY=rect.height*(scale-1)/2;
        offsetX=Math.max(-maxX,Math.min(maxX,baseX+e.touches[0].clientX-dragStart.x));
        offsetY=Math.max(-maxY,Math.min(maxY,baseY+e.touches[0].clientY-dragStart.y));
        render();
      }
    },{passive:false});
    surface.addEventListener('touchend',e=>{if(e.touches.length<2)startDistance=0;if(e.touches.length===1&&scale>1){dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY};baseX=offsetX;baseY=offsetY}else if(!e.touches.length)dragStart=null},{passive:true});
    return()=>{scale=1;startScale=1;startDistance=0;offsetX=0;offsetY=0;dragStart=null;img.style.transform='translate(0px, 0px) scale(1)';img.style.transformOrigin='center center';onScale(1)};
  };

  const resetStageZoom=attachPinchZoom(stage,mainImg,value=>stageScale=value);

  // Fullscreen Lightbox Controls
  const lb=$('#hd-lightbox'), lbImg=$('#lightbox-img'), lbStage=$('#lb-stage');
  let lbScale = 1;
  const resetLightboxZoom=attachPinchZoom(lbStage, lbImg, value => lbScale = value);
  
  function updateLightboxUI(){
    if(!lb || lb.classList.contains('hidden')) return;
    lbImg.src = imgs[cur];
    lbScale = 1;
    resetLightboxZoom();
    const counter = $('#lb-counter');
    if(counter) counter.textContent = `${cur + 1} / ${imgs.length}`;
    document.querySelectorAll('.lb-thumb-btn').forEach((tb, idx) => {
      const active = (idx === cur);
      tb.className = `lb-thumb-btn relative w-12 h-16 sm:w-14 sm:h-18 rounded-xl overflow-hidden cursor-pointer border-2 transition-all shrink-0 ${active ? 'border-white scale-105 shadow-md opacity-100' : 'border-white/20 opacity-50 hover:opacity-100'}`;
    });
  }

  const openLb = () => {
    updateLightboxUI();
    lb.classList.remove('hidden');
    document.documentElement.classList.add('overflow-hidden');
    document.body.classList.add('overflow-hidden', 'touch-none');
    try {
      history.pushState({ thaaraiLightbox: true, pid: p.id }, '', location.href);
    } catch(e){}
  };

  const closeLb = (fromPopstate = false) => {
    if(lb.classList.contains('hidden')) return;
    lb.classList.add('hidden');
    document.documentElement.classList.remove('overflow-hidden');
    document.body.classList.remove('overflow-hidden', 'touch-none');
    lbScale = 1;
    resetLightboxZoom();
    if(!fromPopstate && history.state && history.state.thaaraiLightbox){
      history.back();
    }
  };

  // Open on clicking main image stage or zoom icon
  stage.onclick = (e) => {
    if(e.target.closest('#img-prev') || e.target.closest('#img-next')) return;
    openLb();
  };
  $('#open-lightbox-btn').onclick = (e) => {
    e.stopPropagation();
    openLb();
  };

  // Close via back button or top close button
  $('#close-lightbox').onclick = (e) => { e.stopPropagation(); closeLb(); };
  const lbBack = $('#lb-back-btn');
  if(lbBack) lbBack.onclick = (e) => { e.stopPropagation(); closeLb(); };

  // Only touching the background closes the full screen view; touching the image itself does NOT close
  lb.onclick = (e) => {
    if(e.target.closest('#lightbox-img') || e.target.closest('#lb-thumbs') || e.target.closest('#close-lightbox') || e.target.closest('#lb-back-btn')) return;
    closeLb();
  };

  // Swipe to move photos ONLY when out of zoom (scale <= 1.05). In zoom, swipe is strictly disabled so user can pan freely
  let lbSwipeX0 = null;
  lbStage.addEventListener('touchstart', e => {
    lbSwipeX0 = (e.touches.length === 1 && lbScale <= 1.05) ? e.touches[0].clientX : null;
  }, { passive: true });
  lbStage.addEventListener('touchend', e => {
    if(e.touches.length || lbSwipeX0 === null) { lbSwipeX0 = null; return; }
    const dx = e.changedTouches[0].clientX - lbSwipeX0;
    if(lbScale <= 1.05 && imgs.length > 1 && Math.abs(dx) > 40) {
      switchImage(cur + (dx < 0 ? 1 : -1));
    }
    lbSwipeX0 = null;
  });

  // Lightbox Bottom Thumbnails click
  document.querySelectorAll('.lb-thumb-btn').forEach(tb => {
    tb.onclick = (e) => {
      e.stopPropagation();
      switchImage(Number(tb.dataset.idx));
    };
  });
  const onAdd=()=>addCart(p.id,1,p.stock);
  const onBuy=()=>{
    // Buy Now is strictly 1 quantity, does NOT touch or increase the shopping bag, and goes directly to checkout
    buyNowItem = { id: p.id, qty: 1, p: p };
    location.hash = '#/checkout?mode=buy_now&id=' + encodeURIComponent(p.id);
  };
  $('#btn-add-bag').onclick=onAdd;$('#btn-buy-now').onclick=onBuy;
  $('#mob-add-bag').onclick=onAdd;$('#mob-buy-now').onclick=onBuy;
  $('#pin-check-btn').onclick=()=>{
    const pin=$('#pin-input').value.trim(), out=$('#pin-feedback');
    if(!/^[1-9]\d{5}$/.test(pin)){out.textContent='Please enter a valid 6-digit pincode';out.className='text-[11px] mt-1.5 font-bold text-rose-600';return}
    const d=new Date(Date.now()+5*864e5);
    out.textContent=`Estimated delivery by ${d.toLocaleDateString('en-IN',{weekday:'short',month:'short',day:'numeric'})}`;
    out.className='text-[11px] mt-1.5 font-bold text-emerald-700';
  };
}

/* ===== CHECKOUT ===== */
async function checkout(){
  const [path, qs] = (location.hash || '').slice(1).split('?');
  const params = new URLSearchParams(qs || '');
  const isBuyNow = params.get('mode') === 'buy_now';
  const buyNowId = params.get('id');

  let L = [];
  if(isBuyNow){
    if(buyNowItem && (!buyNowId || String(buyNowItem.id) === String(buyNowId))){
      L = [{ id: buyNowItem.id, qty: buyNowItem.qty || 1, p: buyNowItem.p }];
    } else if(buyNowId && sb){
      const { data: prod } = await sb.from('products').select('*').eq('id', buyNowId).maybeSingle();
      if(prod){
        buyNowItem = { id: prod.id, qty: 1, p: prod };
        L = [{ id: prod.id, qty: 1, p: prod }];
      }

    if(!L.length || !L[0].p){
      toast('Product not found for checkout');
      location.hash = '#/shop';

            </div>

          setTimeout(() => {
            location.href = '#/account/orders';
            location.reload();
          }, 3000);
          return;

        } catch(err){
          toast(err.message || 'Error placing order');
          b.disabled = false;
          b.textContent = 'Confirm & Place Order · ' + inr(totalPayable);
        }
      };

      return;

  // Live item quantity adjuster handler in Step 1
  app.onclick = async e => {
    // Quantity modifier buttons in Step 1
    const qbtn = e.target.closest('[data-cq]');
    if(qbtn){
      const id = qbtn.dataset.cq;
      const delta = Number(qbtn.dataset.d);
      if(isBuyNow){
        const max = buyNowItem.p.stock || 10;
        const next = buyNowItem.qty + delta;
        if(next < 1) return toast('Minimum 1 quantity required');
        if(next > max) return toast(`Only ${max} available in stock`);
        buyNowItem.qty = next;
        L[0].qty = next;
        await recalculateTotals();
        renderStepView();
      } else {
        const itm = cart.find(x => x.id === id);
        if(!itm) return;
        const line = L.find(l => l.id === id);
        const max = line?.p?.stock || 10;
        const next = itm.qty + delta;
        if(next < 1){
          const ok = await showModalDialog({
            title: 'Remove Saree?',
            message: 'Are you sure you want to remove this saree from your order?',
            confirmText: 'Remove',
            cancelText: 'Keep in Order',
            danger: true
          });
          if(ok){
            cart = cart.filter(x => x.id !== id);
            saveCart();
            L = await cartLines();
            if(!L.length){ location.hash = '#/cart'; return; }
            await recalculateTotals();
            renderStepView();
          }
          return;
        }
        if(next > max) return toast(`Only ${max} available in stock`);
        itm.qty = next;
        line.qty = next;
        saveCart();
        await recalculateTotals();
        renderStepView();
      }
    }
  };

  renderStepView();
}

    googleUser = await resolveOAuthUser();
  }

  // Fallback: check localStorage for Supabase token if available (only if not explicitly logged out)
  if(!googleUser && !p && localStorage.getItem('tt_logged_out') !== '1'){
    try {
      for(let key of Object.keys(localStorage)){
        if(key.startsWith('sb-') && key.endsWith('-auth-token')){
          const parsed = JSON.parse(localStorage.getItem(key));
          if(parsed?.user) googleUser = parsed.user;
          break;

      sessionStorage.removeItem('tt_oauth_pending');
      toast('Welcome, ' + profileName.split(' ')[0] + '! ✓');

      $('#foot')?.classList.remove('!hidden');
      await clearProfile();
      location.hash = '#/login';
      await loginView();
    };
    return;
  }

  // --- STATE 3: INITIAL SCREEN (ONLY GOOGLE LOGIN BUTTON) ---
  window._confirmingDetails = false;
  $('#tabbar')?.classList.remove('hidden');
  $('#nav-back')?.classList.remove('!hidden');

        <div class="w-14 h-14 mx-auto rounded-full bg-slate-900 text-white flex items-center justify-center shadow-soft">

            <circle cx="12" cy="7" r="4"/>

        <p class="text-[11px] text-gray-500 mt-1">${esc(accUI.subtitle || 'Sign in with your Google account to get started.')}</p>
      </div>

      <div class="pt-2">
        <button id="btn-user-google" type="button" class="w-full flex items-center justify-center gap-3 rounded-2xl border border-gray-200 bg-white hover:bg-gray-50 py-3.5 text-xs font-bold text-gray-800 shadow-xs transition active:scale-[0.99]">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5 shrink-0" loading="lazy">
          <span>Sign in with Google</span>
        </button>
        <div class="pt-3 text-center">
          <p class="text-[11px] text-gray-400 font-medium">Safe & secure one-click sign in</p>
        </div>
      </div>
    </div>
  `;

  const bg = $('#btn-user-google');
  if(bg){
    bg.onclick = async () => {
      const orig = bg.innerHTML;
      bg.disabled = true;
      bg.innerHTML = '<span class="inline-block animate-spin mr-1.5">⏳</span> Connecting to Google...';

      try {
        if(window.location.protocol === 'file:'){
          await showModalDialog({
            title: 'Live Website Required',
            message: 'Google Sign-In cannot redirect back to a local file (file:///...). Please test Google Sign-In on your live website (https://thaaraitex.in) or via a local web server.',
            confirmText: 'Understood',
            cancelText: ''
          });
          return;
        }

        // Clear logged out flag and mark oauth pending
        localStorage.removeItem('tt_logged_out');
        localStorage.setItem('tt_oauth_pending', '1');
        localStorage.setItem('tt_oauth_in_flight', '1');
        sessionStorage.setItem('tt_oauth_pending', '1');

        const cleanTarget = window.location.origin + (window.location.pathname || '/');

        // Redirect directly to clean target URL without hash fragment
        const { error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: cleanTarget
          }
        });
        if(error) throw error;
      } catch(err){
        localStorage.removeItem('tt_oauth_in_flight');
        sessionStorage.removeItem('tt_oauth_pending');
        toast(err.message || 'Google Sign-In error');
      } finally {
        if(bg){
          bg.disabled = false;
          bg.innerHTML = orig;
        }
      }
    };
  }
}

const SLBL={pending:'Pending',verified:'Processing',dispatched:'Shipped',delivered:'Delivered',cancelled:'Cancelled'};
const GRP={all:()=>true,pending:o=>o.order_status==='pending',verified:o=>o.order_status==='verified',dispatched:o=>o.order_status==='dispatched',delivered:o=>o.order_status==='delivered',cancelled:o=>o.order_status==='cancelled'};

async function fetchOrders(){
  const p=profile();if(!p)return[];
  try{
    if(sb){
      const {data,error}=await sb.rpc('my_orders',{p_phone:p.phone});
      if(error)throw new Error(error.message);
      OC={list:data||[]};return OC.list;
    }
  }catch{}
  return [];
}

async function orderDetailView(orderId,pf){
  if(!pf){app.innerHTML=loginNeeded('Please login to view this order.');return}
  let list=OC.list||[];
  if(!list.length)list=await fetchOrders();

  const items=ord.items||[], status=ord.order_status||'pending', steps=['pending','verified','dispatched','delivered'], cur=steps.indexOf(status);
  const shortNo=String(ord.id).slice(0,8).toUpperCase(), createdAt=new Date(ord.created_at);
  const deliveryDate = ord.delivered_at || ord.delivery_date || ord.expected_delivery_date || ord.estimated_delivery_date || new Date(createdAt.getTime() + 5 * 864e5);
  const deliveryDateLabel = ord.delivered_at || ord.delivery_date ? 'Delivery date' : 'Estimated delivery';
  // Extract complete shipping address object
  let ship = {};
  if(ord.address){
    if(typeof ord.address === 'object') {
      ship = { ...ord.address };
    } else if(typeof ord.address === 'string'){
      const tr = ord.address.trim();
      if((tr.startsWith('{') && tr.endsWith('}')) || (tr.startsWith('[') && tr.endsWith(']'))){
        try {
          const parsed = JSON.parse(tr);
          if(parsed && typeof parsed === 'object') ship = { ...parsed };
        } catch(e){}
      }
    }
  }

  // Fallback to customer or profile saved address if order address is missing fields
  const savedAddrs = await getAddrs();
  const matchedSaved = savedAddrs.find(sa => sa.phone === (ord.phone || pf.phone) || sa.def) || savedAddrs[0] || {};

  const recipient = ord.name || ord.customer_name || ship.name || matchedSaved.name || pf.name || '';
  const phone = ord.phone || ord.mobile_number || ship.phone || matchedSaved.phone || pf.phone || '';
  const doorNoAndStreet = ship.line || ship.address_line || ship.street || ship.door_no || (typeof ord.address === 'string' && !ord.address.trim().startsWith('{') ? ord.address.trim() : '') || matchedSaved.line || ord.line || '';
  const area = ship.area || matchedSaved.area || '';
  const city = ship.city || matchedSaved.city || ord.city || '';
  const state = ship.state || matchedSaved.state || ord.state || 'Tamil Nadu';
  const pincode = ship.pincode || ship.pin || matchedSaved.pincode || ord.pincode || '';

  // Construct comprehensive formatted address
  let addressLines = [];
  if(doorNoAndStreet) addressLines.push(doorNoAndStreet);
  if(area && !doorNoAndStreet.toLowerCase().includes(area.toLowerCase())) addressLines.push(area);
  const cityState = [city, state].filter(Boolean).join(', ');
  if(cityState) addressLines.push(cityState);
  if(pincode) addressLines.push(`Pincode: ${pincode}`);
  addressLines.push('India');

  const formattedAddress = addressLines.filter(Boolean).join('\n');
  const supportMsg = SET.account_ui?.supportText || 'Contact support on WhatsApp';
  app.innerHTML=`<div class="max-w-md mx-auto space-y-4 my-2">
    ${topbar('Order #'+esc(shortNo),'#/account/orders')}
    <div class="bg-white rounded-3xl p-5 shadow-soft border border-gray-100 space-y-4">
      <div class="flex justify-between items-start"><div><span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Current Status</span><h3 class="font-extrabold text-sm text-gray-900 mt-0.5">${esc(SLBL[status]||status)}</h3><p class="text-[11px] text-gray-500 mt-0.5">Placed ${createdAt.toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</p></div><span class="text-xs ${STL[status]||''}">${esc(SLBL[status]||status)}</span></div>
      <div class="grid grid-cols-2 gap-3 border-t border-gray-100 pt-3 text-xs"><div><span class="block text-gray-500">${deliveryDateLabel}</span><b class="mt-1 block text-gray-900">${new Date(deliveryDate).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</b></div>${ord.tracking_id?`<div><span class="block text-gray-500">Tracking number</span><b class="mt-1 block text-gray-900">${esc(ord.tracking_id)}</b></div>`:''}</div>
      ${status==='cancelled'?'':`<div class="grid grid-cols-4 gap-1.5 text-center">${['Placed','Confirmed','Shipped','Delivered'].map((st,i)=>`<div><div class="h-1.5 rounded-full mb-1.5 ${i<=cur?'bg-slate-900':'bg-gray-200'}"></div><span class="text-[10px] font-bold ${i<=cur?'text-slate-900':'text-gray-400'}">${st}</span></div>`).join('')}</div>`}
    </div>
    <div class="bg-white rounded-3xl p-5 shadow-soft border border-gray-100 space-y-3"><h3 class="font-extrabold text-xs text-gray-900 uppercase tracking-wider">Ordered products (${items.length})</h3>
      <div class="divide-y divide-gray-100">${items.map(i=>{const productId=i.product_id??i.id, productHref=productId!==undefined&&productId!==null?'#/p/'+encodeURIComponent(productId):'';const pCode=getProductId(i);return `<div class="py-3 flex items-center gap-3.5"><a ${productHref?`href="${productHref}"`:''} class="shrink-0 ${productHref?'cursor-pointer':''}"><img src="${esc(i.image||'https://placehold.co/100x120?text=Saree')}" alt="${esc(i.name||'Ordered saree')}" class="w-16 h-20 object-cover rounded-2xl bg-gray-50 border"></a><div class="flex-1 min-w-0"><div class="flex items-center gap-1.5 flex-wrap"><span class="font-mono text-[9px] font-black text-slate-800 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded select-all">ID: ${esc(pCode)}</span><${productHref?'a href="'+productHref+'"':'span'} class="font-bold text-xs text-gray-900 truncate block">${esc(i.name||'Saree')}</${productHref?'a':'span'}></div><p class="text-[11px] text-gray-500 mt-1">Unit price: ${inr(i.price)} · Quantity: <b class="text-gray-900 font-bold">${i.quantity||1}</b></p><b class="text-xs text-slate-900 mt-1 block">${inr(Number(i.price||0)*Number(i.quantity||1))}</b></div></div>`}).join('')}</div></div>

    <!-- Complete Detailed Delivery Address -->

          <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

          <span class="font-bold text-slate-900 text-sm">${esc(recipient || pf.name || 'Customer')}</span>

            <p class="whitespace-pre-line">${esc(formattedAddress)}</p>

      ${ord.coupon?`<div class="flex justify-between text-gray-600"><span>Coupon Applied</span><b class="text-slate-900">${esc(ord.coupon)}</b></div>`:''}
      ${ord.discount?`<div class="flex justify-between text-gray-600"><span>Discount</span><b class="text-emerald-700 font-bold">−${inr(ord.discount)}</b></div>`:''}
      <div class="flex justify-between text-gray-600"><span>Shipping / Delivery</span><b class="text-emerald-700 font-bold">FREE</b></div>
      <div class="flex justify-between text-sm font-extrabold text-slate-900 border-t pt-2.5 mt-2"><span>Total Amount</span><span class="text-emerald-700 font-black text-base">${inr(ord.total)}</span></div>

      ${input('a-name','Full name',`value="${esc(a.name||'')}"`)}${input('a-phone','Mobile number',`maxlength="10" value="${esc(a.phone||profile()?.phone||'')}"`)}${input('a-pin','Pincode',`maxlength="6" value="${esc(a.pincode||'')}"`)}
      <div class="grid grid-cols-2 gap-2">${input('a-city','City',`value="${esc(a.city||'')}"`)}${input('a-state','State',`value="${esc(a.state||'Tamil Nadu')}"`)}</div>
      <label class="block text-xs font-semibold text-gray-700">Door no, street, area<textarea id="a-line" rows="2" class="mt-1 w-full border border-gray-200 rounded-2xl p-2.5 text-xs outline-none">${esc(a.line||'')}</textarea></label>
      <div class="flex gap-2 pt-2"><button id="asv" class="${btn} flex-1 !py-3">Save</button><button id="acn" class="px-5 py-2.5 border rounded-full text-xs font-bold">Cancel</button></div></div>`
    :`<button id="addA" class="bg-white border-2 border-dashed border-gray-300 hover:border-slate-900 rounded-3xl w-full py-3.5 font-bold text-xs text-slate-900 transition shadow-soft">+ Add New Address</button>`}
    <div class="space-y-3">${L.map(x=>`<div class="bg-white rounded-3xl p-4 shadow-soft border border-gray-100 text-xs"><div class="flex items-center justify-between"><b class="text-gray-900">${esc(x.name)}</b>${x.def?'<span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">DEFAULT</span>':''}</div>
      <p class="text-gray-500 mt-1">${esc(x.phone)}</p><p class="text-gray-700 mt-1 leading-relaxed">${esc(x.line)}, ${esc(x.city)}, ${esc(x.state)} - <b>${esc(x.pincode)}</b></p>
      <div class="mt-3 pt-2 border-t flex items-center justify-between font-bold text-[11px]"><button data-ad="${esc(x.id)}" class="text-rose-600 hover:text-rose-700 hover:underline flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>Delete</button><div class="flex items-center gap-3">${x.def?'':`<button data-adef="${esc(x.id)}" class="text-gray-400 hover:text-gray-600 underline">Set as Default</button>`}<button data-ae="${esc(x.id)}" class="text-slate-900 hover:underline flex items-center gap-1">${ICONS.edit}Edit</button></div></div></div>`).join('')||(a?'':'<p class="text-center text-xs text-gray-400 py-8">No saved addresses.</p>')}</div></div>`;
}

async function wishHtml(){
  let wp=[];if(wish.size){try{const {data}=await sb.from('products').select('*').in('id',[...wish]);wp=data||[]}catch{}}
  return `<div class="max-w-4xl mx-auto space-y-4 my-2">${topbar('My Wishlist ('+wp.length+')','#/account/hub')}
    ${wp.length?grid(wp):'<div class="bg-white rounded-3xl p-12 text-center text-gray-400 text-xs border border-gray-100 shadow-soft">Your wishlist is empty.</div>'}</div>`;
}

async function account(section,params){
  const pf=profile();
  if(!pf&&section!=='orders'&&section!=='order-detail'){location.hash='#/login';return}
  if(section==='order-detail'){await orderDetailView(params.get('id')||'',pf);return}
  let body='';
  if(section==='orders')body=await ordersHtml(pf);
  else if(section==='profile')body=profileHtml(pf);
  else if(section==='addresses')body=await addressesHtml();
  else if(section==='wishlist')body=await wishHtml();
  else body=hubHtml(pf);
  app.innerHTML=body;
  window._cancelAddrEdit = () => {
    addrEdit = null;
    history.back();
  };
  app.onclick=async e=>{
    const t=e.target,d=t.dataset,again=()=>account(section,params);
    if(t.id==='lgo'){
      await clearProfile();
      toast('Logged out successfully');
      location.hash = '#/login';
      await loginView();
      return;
    }
    if(d.f){ofilter=d.f;again()}
    if(t.id==='ps'){
      const name=$('#pn').value.trim(),phone=$('#pp').value.trim();
      if(name.length<2)return toast('Enter your name');
      if(!/^[6-9]\d{9}$/.test(phone))return toast('Enter a valid mobile number');
      await setProfile(name,phone,pf.email,pf.google_name);toast('Saved ✓');location.hash='#/account/hub'}
    if(t.id==='addA'){
      addrEdit={};
      try { history.pushState({ inAddrEdit: true }, '', location.href); } catch(e){}
      again();
    }
    if(d.ae){
      showNeonLoader();
      try {
        const L=await getAddrs();
        addrEdit=L.find(x=>x.id===d.ae);
        try { history.pushState({ inAddrEdit: true }, '', location.href); } catch(e){}
        await again();
      } finally {
        hideNeonLoader();
      }
    }
    if(d.ad){
      const ok = await showModalDialog({
        title: 'Delete Address?',
        message: 'Are you sure you want to delete this saved delivery address from your account?',
        confirmText: 'Delete',
        cancelText: 'Keep Address',
        danger: true
      });
      if(ok){
        let L=await getAddrs();
        await setAddrs(L.filter(x=>x.id!==d.ad));
        toast('Address removed ✓');
        again();
      }
    }
    if(d.adef){let L=await getAddrs();await setAddrs(L.map(x=>({...x,def:x.id===d.adef})));again()}
    if(t.id==='acn'){
      addrEdit=null;
      history.back();
    }
    if(t.id==='asv'){
      const n={name:$('#a-name').value.trim(),phone:$('#a-phone').value.trim(),pincode:$('#a-pin').value.trim(),city:$('#a-city').value.trim(),state:$('#a-state').value.trim(),line:$('#a-line').value.trim()};
      if(!n.name||!n.city||!n.state||!n.line)return toast('Please fill all fields');
      if(!/^[6-9]\d{9}$/.test(n.phone))return toast('Enter a valid mobile number');
      if(!/^[1-9]\d{5}$/.test(n.pincode))return toast('Enter a valid 6-digit pincode');
      let L=await getAddrs();
      if(addrEdit.id){n.id=addrEdit.id;n.def=addrEdit.def;L=L.map(x=>x.id===n.id?n:x)}else{n.id=Date.now().toString(36);n.def=!L.length;L.push(n)}
      await setAddrs(L);addrEdit=null;toast('Address saved ✓');again()}
  };
}

/* ===== ROUTER ===== */
let _routing = false;
async function route(){
  if(_routing) return;
  _routing = true;

  try {
    app.onclick=null;if(window._bt)clearInterval(window._bt);
    document.title=(SET.brand?.name || 'Thaarai Tex') + (SET.brand?.tagline ? ' | ' + SET.brand.tagline : '');

    const rawHash = location.hash || '';
    const rawSearch = location.search || '';
    const isOAuthReturn = !!(
      _incomingOAuthCode ||
      rawSearch.includes('code=') ||
      rawHash.includes('code=') ||
      rawHash.includes('access_token=') ||
      rawHash.includes('refresh_token=') ||
      localStorage.getItem('tt_oauth_in_flight') === '1' ||
      sessionStorage.getItem('tt_oauth_pending') === '1'
    );

    const p = profile();

    // 1. If returning from OAuth and profile is not yet completed:
    if(isOAuthReturn && !p){
      location.hash = '#/login';
      app.innerHTML = `
        <div class="max-w-sm mx-auto bg-white border border-gray-100 rounded-3xl p-8 text-center space-y-4 shadow-soft my-10">
          <div class="w-12 h-12 mx-auto rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center animate-spin">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
          </div>
          <p class="text-xs font-bold text-slate-800">Signing in with Google…</p>
          <p class="text-[11px] text-gray-400">Verifying account details, please wait.</p>
        </div>
      `;
      const user = await resolveOAuthUser();
      try {
        history.replaceState(null, '', location.pathname + '#/login');
      } catch(e){}
      return await loginView(user);
    }

    // 2. If user is visiting root/home or login, has no profile, but an active Google OAuth session exists:
    if(!p && (rawHash === '' || rawHash === '#' || rawHash === '#/' || rawHash.startsWith('#/login')) && localStorage.getItem('tt_logged_out') !== '1'){
      const user = await resolveOAuthUser();
      if(user && user.email){
        location.hash = '#/login';
        return await loginView(user);
      }
    }

    // 3. Lock guard: if user is confirming details in State 2, do not allow routing away
    if(window._confirmingDetails && !p && rawHash !== '#/login'){
      location.hash = '#/login';
      toast('Please click Confirm & Complete Login to continue');
      return;
    }

    const [path,qs]=(location.hash||'#/').slice(1).split('?'), params=new URLSearchParams(qs||'');
    $('#tabbar').classList.toggle('hidden',path.startsWith('/p/')||path==='/checkout');
    const isHomePage = (path === '/' || path === '');
    const footEl = $('#foot');
    if(footEl) footEl.classList.toggle('hidden', !isHomePage);
    document.querySelectorAll('.tb').forEach(a=>{const on=a.dataset.tb.split('|').some(k=>k==='/'?(path==='/'||path===''):path.startsWith(k));a.style.color=on?'#0f172a':'#94a3b8'});
    
    // Don't show loading animation on profile tab (#/login or #/account/hub) or edit profile (#/account/profile)
    const skipLoader = path === '/login' || path === '/account/hub' || path === '/account' || path === '/account/profile';
    if(!skipLoader) showNeonLoader();
    try{
      if(path==='/'||path==='')await home();
      else if(path==='/shop')await shop(params);
      else if(path.startsWith('/p/'))await product(path.slice(3));
      else if(path==='/cart')await cartView();
      else if(path==='/checkout')await checkout();
      else if(path.startsWith('/account'))await account(path.split('/')[2]||'hub',params);
      else if(path==='/login'){ await loginView(); }
      else app.innerHTML='<p class="text-center py-20 text-xs text-gray-400">Page not found.</p>';
    }catch(err){console.error(err);app.innerHTML='<p class="text-center text-rose-600 py-20 text-xs">Error: '+esc(err.message||err)+'</p>';}
    finally {
      hideNeonLoader();
    }
    window.scrollTo(0,0);
  } finally {
    _routing = false;
  }
}

window.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)e.preventDefault()},{passive:false});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','0'].includes(e.key))e.preventDefault()},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b){e.preventDefault();e.stopPropagation();toggleWish(b.dataset.w)}},true);
$('#sf').onsubmit=e=>{e.preventDefault();location.hash='#/shop?q='+encodeURIComponent($('#q').value.trim())};
$('#sf2').onsubmit=e=>{e.preventDefault();location.hash='#/shop?q='+encodeURIComponent($('#q2').value.trim());$('#msearch').classList.add('hidden')};
$('#msb').onclick=()=>{$('#msearch').classList.toggle('hidden');$('#q2').focus()};

/* ===== FIX: BRAND CLICK NAVIGATION (NEVER SHOWS EXIT DIALOG) ===== */
$('#brand').addEventListener('click', e => {
  e.preventDefault();
  e.stopPropagation();
  if(location.hash !== '#/' && location.hash !== '#' && location.hash !== '') {
    location.hash = '#/';
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

/* ===== HOME TAB HARD RELOAD & BACK TRAP LOOP ===== */
let currentRoute = location.hash || '#/';
let isLinkNavigation = false;

document.addEventListener('click', (e) => {
  const link = e.target.closest('a[href]');
  if(link){
    const h = link.getAttribute('href');
    if(h && (h.startsWith('#') || h.startsWith('/#'))){
      isLinkNavigation = true;
      setTimeout(() => { isLinkNavigation = false; }, 400);
    }
  }
}, true);

function armHomeGuard(){
  try {
    const s = { thaaraiHomeGuard: true, t: Date.now() };
    history.pushState(s, '', '#/');
  } catch(e){}
}

function showConfirmLoginPopup(){
  let popup = $('#confirm-login-modal');
  if(!popup){
    popup = document.createElement('div');
    popup.id = 'confirm-login-modal';
    popup.className = 'fixed inset-0 z-[10002] bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-200';
    document.body.appendChild(popup);
  }
  popup.innerHTML = `
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-gray-100 space-y-4 animate-scaleUp text-center">
      <div class="w-14 h-14 mx-auto rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center justify-center shadow-soft">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>
      <div>
        <h3 class="font-extrabold text-base text-gray-900">Please Confirm Login</h3>
        <p class="text-xs text-gray-500 mt-1.5 leading-relaxed">
          Please enter your name and mobile number and click <strong>Confirm & Complete Login</strong> to proceed. You cannot go back until your details are confirmed.
        </p>
      </div>
      <div class="pt-2">
        <button id="btn-popup-confirm-login" type="button" class="${btn} w-full !py-3.5 text-xs font-bold shadow-soft">
          Confirm Login
        </button>
      </div>
    </div>
  `;
  popup.classList.remove('hidden');

  const confirmBtn = $('#btn-popup-confirm-login');
  if(confirmBtn){
    confirmBtn.onclick = () => {
      popup.classList.add('hidden');
      const submitBtn = $('#btn-confirm-login');
      if(submitBtn) submitBtn.click();
      else $('#ln')?.focus();
    };
  }
}

window.addEventListener('popstate', event => {
  // 0. If user is in State 2 (Confirming Google Details with Name & Phone): LOCKED LOOP
  if(window._confirmingDetails && !profile()){
    try {
      history.pushState({ confirmingDetailsGuard: true, t: Date.now() }, '', '#/login');
    } catch(e){}
    location.hash = '#/login';

    const loginPopup = $('#confirm-login-modal');
    if(loginPopup && !loginPopup.classList.contains('hidden')){
      // If popup is already open and user swipes back again -> stay on name & mobile page, close popup
      loginPopup.classList.add('hidden');
      return;
    }

    // First swipe back -> show confirm login popup
    showConfirmLoginPopup();
    return;
  }
  // 1. Close open modals first
  const lb = $('#hd-lightbox');
  if(lb && !lb.classList.contains('hidden')){
    lb.classList.add('hidden');
    document.documentElement.classList.remove('overflow-hidden');
    document.body.classList.remove('overflow-hidden', 'touch-none');
    return;
  }
  const sortModal = $('#sort-page-modal');
  if(sortModal && !sortModal.classList.contains('hidden')){
    sortModal.classList.add('hidden');
    document.documentElement.classList.remove('overflow-hidden');
    document.body.classList.remove('overflow-hidden', 'touch-none');
    return;
  }
  const fl = $('#fl');
  if(fl && !fl.classList.contains('hidden')){
    fl.classList.add('hidden');
    document.documentElement.classList.remove('overflow-hidden');
    document.body.classList.remove('overflow-hidden', 'touch-none');
    return;
  }

  const current = location.hash || '#/';

  // Handle Address Edit cancellation on Back gesture
  if(addrEdit){
    addrEdit = null;
    account('addresses');
    return;
  }

  // Handle Checkout Stepper back navigation (Steps 2, 3, 4, and sub-pages)
  if(window._checkoutState){
    const wasHandled = window._checkoutState.goBack();
    if(wasHandled){
      return;
    } else {
      window._checkoutState = null;
      if(location.hash.startsWith('#/checkout')){
        history.back();
        return;
      }
    }
  }

  // 2. Traps back swipe / back button on Home: ALWAYS hard reload home
  if(current === '#/' || current === '#' || current === ''){
    try {
      history.pushState({ thaaraiHomeGuard: true }, '', '#/');
    } catch(e){}
    location.href = '#/';
    window.location.reload();
    return;
  }

  // 3. For all other pages, route() immediately renders the previous page
  route();
});

// Header back navigation button: If on home, reload home
$('#nav-back').onclick = () => {
  if(window._confirmingDetails && !profile()){
    showConfirmLoginPopup();
    return;
  }
  const lb = $('#hd-lightbox');
  if(lb && !lb.classList.contains('hidden')){
    lb.classList.add('hidden');
    document.documentElement.classList.remove('overflow-hidden');
    document.body.classList.remove('overflow-hidden', 'touch-none');
    return;
  }
  const sortModal = $('#sort-page-modal');
  if(sortModal && !sortModal.classList.contains('hidden')){
    sortModal.classList.add('hidden');
    document.body.style.overflow = '';
    return;
  }
  const fl = $('#fl');
  if(fl && !fl.classList.contains('hidden')){
    fl.classList.add('hidden');
    document.body.style.overflow = '';
    return;
  }

  const current = location.hash || '#/';
  if(addrEdit){
    addrEdit = null;
    history.back();
    return;
  }
  if(current === '#/' || current === '' || current === '#'){
    location.href = '#/';
    window.location.reload();
    return;
  }
  if(current.startsWith('#/shop?')){
    location.hash = '#/shop';
    return;
  }

  // Header back button handling in checkout
  if(window._checkoutState){
    const wasHandled = window._checkoutState.goBack();
    if(wasHandled) return;
  }

  history.back();
};

window.addEventListener('hashchange', () => {
  route();
});

const originalRoute = route;
route = async function(){
  currentRoute = location.hash || '#/';
  await originalRoute();
  if(currentRoute === '#/' || currentRoute === '' || currentRoute === '#'){
    armHomeGuard();
  }
};


// Pre-check: If returning from Google OAuth, pin hash to #/login immediately
if(_isOAuthIncoming){
  if(location.hash !== '#/login'){
    location.hash = '#/login';
  }
}

Promise.all([initAuth(), loadSiteSettings()]).then(() => {
  route();
});
