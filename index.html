<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thaarai Tex | Pure Sarees & Handloom</title>
<meta name="description" content="Handloom silk and cotton sarees direct from weavers. Free delivery, Cash on Delivery.">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{overflow-x:hidden;max-width:100%}
body{font-family:'Manrope','Noto Sans Tamil',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{min-width:0}
h1,h2,h3,p,label,td,li{overflow-wrap:anywhere}
.text-xs,.text-sm,.text-base,.text-lg,.text-xl{line-height:1.65!important}
.text-\[10px\],.text-\[11px\]{line-height:1.5!important}
.text-2xl,.text-3xl,.text-4xl{line-height:1.3!important}
.line-clamp-1,.line-clamp-2{line-height:1.6!important}
input,select,textarea{font-size:16px!important}
.rounded-lg{border-radius:.9rem!important}.rounded-xl{border-radius:1.2rem!important}.rounded-2xl{border-radius:1.5rem!important}
.shadow,.shadow-sm,.shadow-md{box-shadow:0 2px 14px rgba(0,0,0,.06)!important}
.bg-gray-50{background-color:#f6f6f6!important}.bg-gray-100{background-color:#f3f3f3!important}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
#brand{max-width:55vw;overflow:hidden}
nav.overflow-x-auto{scrollbar-width:none}nav.overflow-x-auto::-webkit-scrollbar{display:none}
</style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
<div id="ann" class="text-xs py-2 px-3 text-center"></div>
<header class="bg-white/95 backdrop-blur sticky top-0 z-40 border-b">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <a href="#/" id="brand" class="flex flex-col"></a>
    <form id="sf" class="flex-1 hidden sm:block max-w-md mx-auto"><input id="q" placeholder="சேலைகளைத் தேடுங்கள்… Search sarees" class="w-full bg-[#f3f3f3] rounded-full py-2.5 px-5 outline-none"></form>
    <nav class="flex items-center gap-1 ml-auto text-sm">
      <button id="msb" aria-label="Search" class="sm:hidden w-10 h-10 rounded-full grid place-items-center"><svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <a href="#/shop" class="hidden sm:block px-3 py-2 rounded-full hover:bg-gray-100">Shop</a>
      <a href="#/login" id="lgn" class="hidden sm:block px-3 py-2 rounded-full hover:bg-gray-100">👤 Login</a>
      <a href="#/account/orders" id="acc" class="hidden sm:block px-3 py-2 rounded-full hover:bg-gray-100">📦 Orders</a>
      <a href="#/cart" aria-label="Bag" class="relative w-10 h-10 rounded-full grid place-items-center bg-slate-900 text-white sm:w-auto sm:px-4 sm:flex sm:items-center sm:gap-2"><svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="cc absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] px-1 grid place-items-center hidden">0</span></a>
    </nav></div>
  <div id="msearch" class="hidden px-4 pb-3 sm:hidden"><form id="sf2"><input id="q2" placeholder="Search sarees…" class="w-full bg-[#f3f3f3] rounded-full py-3 px-5 outline-none"></form></div>
</header>
<main id="app" class="max-w-6xl mx-auto px-4 pt-5 pb-28 min-h-[70vh]"></main>
<footer id="foot" class="bg-slate-900 text-gray-300 text-xs pt-8 pb-28 sm:pb-8 mt-10"></footer>

<!-- Bottom Navigation Bar (Displays on both Mobile & Desktop) -->
<nav id="tabbar" class="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur border-t grid grid-cols-5 text-[10px] font-semibold max-w-lg mx-auto sm:rounded-t-2xl sm:shadow-lg sm:border-x" style="padding-bottom:env(safe-area-inset-bottom)">
  <a href="#/" data-tb="/" class="tb relative flex flex-col items-center gap-0.5 py-2 text-gray-400"><svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
  <a href="#/shop" data-tb="/shop" class="tb relative flex flex-col items-center gap-0.5 py-2 text-gray-400"><svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Shop</span></a>
  <a href="#/cart" data-tb="/cart" class="tb relative flex flex-col items-center gap-0.5 py-2 text-gray-400"><span class="relative"><svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="cc absolute -top-1 -right-2 bg-rose-600 text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 px-1 grid place-items-center hidden">0</span></span><span>Bag</span></a>
  <a href="#/account/wishlist" data-tb="/account/wishlist" class="tb relative flex flex-col items-center gap-0.5 py-2 text-gray-400"><svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><span>Wishlist</span></a>
  <a href="#/account/hub" data-tb="/account/hub|/account/profile|/account/orders|/account/addresses|/login" id="tbp" class="tb relative flex flex-col items-center gap-0.5 py-2 text-gray-400"><svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></a>
</nav>
<div id="toast" class="fixed bottom-24 sm:bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow hidden z-50"></div>

<script>
/* ===== CONFIG ===== */
const SUPABASE_URL="https://hjogdvqwwbgzgwtdlrak.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_gURnxsEPWoxUqqAqnEtJ_g_EmUlUgUZ";
let WHATSAPP="919999999999";
let UPI_ID="yourname@upi", UPI_NAME="Thaarai Tex";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const img=p=>esc(p.images?.[0]||'https://placehold.co/400x500?text=Thaarai+Tex');
const store={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let cart=store.get('cart')||[], user=null, coupon='';
const off=p=>p.mrp>p.price?Math.round((p.mrp-p.price)/p.mrp*100):0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hidden'),2200)}
function saveCart(){store.set('cart',cart);const n=cart.reduce((s,i)=>s+i.qty,0);document.querySelectorAll('.cc').forEach(e=>{e.textContent=n;e.classList.toggle('hidden',!n)})}
const heart=a=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="${a?'#e11d48':'none'}" stroke="${a?'#e11d48':'currentColor'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>`;
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));

const DEF={
 brand:{name:'Thaarai Tex',tagline:'Premium Sarees',logo:''},
 announce:{on:true,text:'✨ இலவச டெலிவரி (Free Delivery) & COD / UPI',bg:'#0f172a',color:'#ffffff'},
 theme:{primary:'#0f172a'},
 banners:[{image:'',title:'பாரம்பரிய பட்டு & காட்டன் சேலைகள்',subtitle:'நேரடி நெசவாளர் விலை · Cash on Delivery & UPI',btn:'Shop Now',link:'#/shop',c1:'#1e293b',c2:'#0f172a'}],
 sections:{cats:true,deals:true,fresh:true,trust:true,about:false,catsTitle:'Shop by Category',dealsTitle:'Best Value',freshTitle:'New Arrivals'},
 trust:[{icon:'🚚',text:'Free Delivery'},{icon:'💵',text:'Cash on Delivery'},{icon:'🧵',text:'100% Handloom'},{icon:'📲',text:'UPI Payments'}],
 about:{title:'Our Story',text:'',image:''},
 footer:{about:'Handloom sarees direct from the weavers.',phone:'',email:'',address:'Melur, Tamil Nadu',whatsapp:'919999999999',upi:'yourname@upi',upiName:'Thaarai Tex',instagram:'',facebook:''}
};
const merge=(a,b)=>{if(Array.isArray(b))return b;if(b&&typeof b==='object'){const o={...a};for(const k in b)o[k]=merge(a?.[k],b[k]);return o}return b===undefined?a:b};
let SET=JSON.parse(JSON.stringify(DEF));
const hx=(c,d)=>/^#[0-9a-f]{6}$/i.test(c||'')?c:d;
const safeLink=u=>/^(#|https?:\/\/|\/)/.test(u||'')?u:'#/shop';
function applySettings(){
  const b=SET.brand,a=SET.announce,f=SET.footer,p=hx(SET.theme.primary,'#0f172a');
  $('#brand').innerHTML=b.logo?`<img src="${esc(b.logo)}" alt="${esc(b.name)}" class="h-9 max-w-[170px] object-contain">`:`<span class="font-black text-xl uppercase tracking-tight text-slate-900">${esc(b.name)}</span><span class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider">${esc(b.tagline)}</span>`;
  const an=$('#ann');an.style.display=a.on?'':'none';an.textContent=a.text;an.style.background=hx(a.bg,'#0f172a');an.style.color=hx(a.color,'#ffffff');
  let st=document.getElementById('th');if(!st){st=document.createElement('style');st.id='th';document.head.appendChild(st)}
  st.textContent=`:root{--p:${p}}.bg-slate-900{background-color:var(--p)!important}.hover\\:bg-slate-800:hover{background-color:var(--p)!important;filter:brightness(1.2)}.text-slate-900{color:var(--p)!important}`;
  WHATSAPP=f.whatsapp||WHATSAPP;UPI_ID=f.upi||UPI_ID;UPI_NAME=f.upiName||UPI_NAME;
  const lk=(u,t)=>u?`<a class="underline" target="_blank" rel="noopener" href="${esc(safeLink(u))}">${t}</a> `:'';
  $('#foot').innerHTML=`<div class="max-w-6xl mx-auto px-4 grid sm:grid-cols-3 gap-6 text-left"><div><b class="text-white text-sm">${esc(b.name)}</b><p class="mt-2 leading-relaxed">${esc(f.about)}</p></div>
   <div><b class="text-white text-sm">Contact</b><p class="mt-2 leading-6">${f.phone?`📞 <a href="tel:${esc(f.phone)}">${esc(f.phone)}</a><br>`:''}${f.email?`✉️ ${esc(f.email)}<br>`:''}${f.address?`📍 ${esc(f.address)}`:''}</p></div>
   <div><b class="text-white text-sm">Quick links</b><p class="mt-2 leading-7"><a href="#/shop" class="underline">Shop</a> · <a href="#/account/orders" class="underline">My Orders</a><br>${f.whatsapp?lk('https://wa.me/'+f.whatsapp,'WhatsApp support'):''}${lk(f.instagram,'Instagram')}${lk(f.facebook,'Facebook')}</p></div></div>
   <p class="mt-5 text-center text-gray-400">© ${new Date().getFullYear()} ${esc(b.name)}. All rights reserved.</p>`;
}
async function loadSettings(){
  try{const {data}=await sb.from('site_settings').select('data').eq('id','main').maybeSingle();if(data?.data)SET=merge(DEF,data.data)}catch{}
  applySettings();
}
applySettings();

/* ===== WISHLIST ===== */
let wish=new Set(store.get('wish')||[]);
function setNav(){
  const p=store.get('profile');
  $('#acc').textContent='📦 Orders';
  $('#lgn').textContent=p?'👤 '+p.name.split(' ')[0]:'👤 Login';
  $('#lgn').href=p?'#/account/hub':'#/login';
  $('#tbp').href=p?'#/account/hub':'#/login';
}
async function initAuth(){setNav()}
function toggleWish(id){wish.has(id)?wish.delete(id):wish.add(id);store.set('wish',[...wish]);route()}

/* ===== CART ===== */
function addCart(id,qty=1,max=10){
  const e=cart.find(i=>i.id===id);
  if(e){if(e.qty+qty>max)return toast('Max stock reached');e.qty+=qty}else cart.push({id,qty});
  saveCart();toast('Added to bag ✓');
}
async function cartLines(){
  if(!cart.length)return[];
  const {data}=await sb.from('products').select('*').in('id',cart.map(i=>i.id));
  return cart.map(i=>({...i,p:(data||[]).find(p=>p.id===i.id)})).filter(l=>l.p);
}
async function couponDiscount(sub){
  if(!coupon)return 0;
  const {data}=await sb.rpc('check_coupon',{p_code:coupon,p_subtotal:sub});
  return Number(data)||0;
}

/* ===== COMPONENTS ===== */
function card(p){
  const o=off(p);
  return `<a href="#/p/${p.id}" class="block group">
   <div class="relative aspect-[4/5] bg-[#f3f3f3] rounded-3xl overflow-hidden border border-gray-100">
    <img loading="lazy" src="${img(p)}" alt="${esc(p.name)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
    ${o?`<span class="absolute top-3 left-3 bg-slate-900 text-white text-[10px] font-bold px-2.5 py-1 rounded-full">${o}% OFF</span>`:''}
    <button data-w="${p.id}" aria-label="Wishlist" class="absolute top-3 right-3 bg-white w-9 h-9 rounded-full shadow-sm grid place-items-center">${heart(wish.has(p.id))}</button>
    ${p.stock<=0?'<div class="absolute inset-0 bg-white/65 grid place-items-center text-xs font-bold">Out of stock</div>':''}
   </div>
   <div class="pt-3 px-1"><h3 class="font-semibold text-sm line-clamp-1">${esc(p.name)}</h3>
    <div class="mt-0.5 flex items-baseline gap-2 flex-wrap"><b class="text-base">${inr(p.price)}</b>${o?`<s class="text-xs text-gray-400">${inr(p.mrp)}</s>`:''}</div>
    ${p.stock>0&&p.stock<5?`<p class="text-[11px] text-orange-600">Only ${p.stock} left</p>`:''}</div></a>`;
}
const grid=ps=>ps.length?`<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-x-3 gap-y-7 sm:gap-x-5">${ps.map(card).join('')}</div>`:'<p class="text-center text-gray-500 py-16">பொருட்கள் எதுவும் இல்லை. No products found.</p>';
const input=(id,label,extra='')=>`<label class="block text-xs font-medium mb-1">${label}<input id="${id}" ${extra} class="mt-1 w-full border border-gray-200 bg-white rounded-xl p-3 text-sm outline-none focus:border-slate-900"></label>`;
const btn='bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-6 rounded-full text-sm transition disabled:opacity-50';

/* ===== VIEWS ===== */
async function home(){
  const sc=SET.sections, bn=SET.banners||[];
  const [{data:cats},{data:neu,error:e2},{data:deals}]=await Promise.all([
    sb.from('categories').select('*'),
    sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false}).limit(8),
    sb.from('products').select('*').eq('active',true).gt('stock',0).order('price').limit(4)]);
  if(e2)throw e2;
  const slide=(b,i)=>`<div class="slide absolute inset-0 transition-opacity duration-700 ${i?'opacity-0 pointer-events-none':''} flex flex-col justify-end p-6 sm:p-12 text-white" style="background:linear-gradient(110deg,${hx(b.c1,'#1e293b')},${hx(b.c2,'#0f172a')})">
    ${b.image?`<img src="${esc(b.image)}" alt="" class="absolute inset-0 w-full h-full object-cover">`:''}
    <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/20 to-transparent"></div>
    <div class="relative max-w-xl pb-4"><h1 class="text-2xl sm:text-4xl font-extrabold">${esc(b.title)}</h1><p class="mt-1 text-sm text-gray-100">${esc(b.subtitle)}</p>
    ${b.btn?`<a href="${esc(safeLink(b.link))}" class="inline-flex items-center gap-2 mt-3 text-sm font-semibold border-b border-white/70 pb-0.5">${esc(b.btn)} <span>→</span></a>`:''}</div></div>`;
  app.innerHTML=`
  <h1 class="text-3xl font-extrabold mb-4 sm:hidden">Discover</h1>
  ${bn.length?`<section id="car" class="relative rounded-3xl overflow-hidden h-72 sm:h-96">${bn.map(slide).join('')}${bn.length>1?`<div class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5 z-10">${bn.map((_,i)=>`<button data-dot="${i}" class="dot w-2 h-2 rounded-full ${i?'bg-white/50':'bg-white'}"></button>`).join('')}</div>`:''}</section>`:''}
  ${sc.trust?`<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 my-4">${(SET.trust||[]).filter(t=>t.text).map(t=>`<div class="bg-white rounded-2xl py-3.5 px-2 text-center text-xs font-semibold border border-gray-100 shadow-sm"><div class="text-xl">${esc(t.icon)}</div>${esc(t.text)}</div>`).join('')}</div>`:''}
  ${sc.cats&&cats?.length?`<h2 class="font-bold text-lg mt-6 mb-3">${esc(sc.catsTitle)}</h2><div class="flex gap-4 overflow-x-auto pb-2">${cats.map(c=>`<a href="#/shop?cat=${c.id}" class="shrink-0 w-20 text-center"><img loading="lazy" src="${esc(c.image||'https://placehold.co/160?text='+encodeURIComponent((c.name||'?')[0]))}" alt="" class="w-20 h-20 rounded-full object-cover border-2 border-white shadow"><p class="text-xs font-semibold mt-1 line-clamp-2">${esc(c.name)}</p></a>`).join('')}</div>`:''}
  ${sc.deals?`<h2 class="font-bold text-lg mt-6 mb-3">${esc(sc.dealsTitle)}</h2>${grid(deals||[])}`:''}
  ${sc.fresh?`<h2 class="font-bold text-lg mt-8 mb-3">${esc(sc.freshTitle)}</h2>${grid(neu||[])}`:''}
  ${sc.about&&SET.about.text?`<section class="bg-white border rounded-2xl p-6 mt-8 grid ${SET.about.image?'sm:grid-cols-2':''} gap-5 items-center">${SET.about.image?`<img src="${esc(SET.about.image)}" alt="" class="rounded-xl w-full object-cover max-h-72">`:''}<div><h2 class="font-bold text-xl">${esc(SET.about.title)}</h2><p class="text-sm text-gray-600 mt-2 whitespace-pre-line leading-relaxed">${esc(SET.about.text)}</p></div></section>`:''}`;
  const car=$('#car');
  if(car&&bn.length>1){let i=0;const sl=[...car.querySelectorAll('.slide')],dots=[...car.querySelectorAll('.dot')];
    const show=n=>{i=n;sl.forEach((x,k)=>{x.classList.toggle('opacity-0',k!==n);x.classList.toggle('pointer-events-none',k!==n)});dots.forEach((d,k)=>{d.classList.toggle('bg-white',k===n);d.classList.toggle('bg-white/50',k!==n)})};
    dots.forEach((d,k)=>d.onclick=()=>show(k));window._bt=setInterval(()=>show((i+1)%sl.length),5000)}
}

async function shop(params){
  const f={q:params.get('q')||'',cat:params.get('cat')||'',fabric:params.get('fabric')||'',min:params.get('min')||'',max:params.get('max')||'',sort:params.get('sort')||'new',stock:params.get('stock')||''};
  const {data:cats}=await sb.from('categories').select('*');
  let q=sb.from('products').select('*').eq('active',true);
  if(f.q)q=q.or(`name.ilike.%${f.q.replace(/[%,()]/g,'')}%,description.ilike.%${f.q.replace(/[%,()]/g,'')}%`);
  if(f.cat)q=q.eq('category_id',f.cat);
  if(f.fabric)q=q.eq('fabric',f.fabric);
  if(f.min)q=q.gte('price',+f.min);
  if(f.max)q=q.lte('price',+f.max);
  if(f.stock)q=q.gt('stock',0);
  q=f.sort==='low'?q.order('price'):f.sort==='high'?q.order('price',{ascending:false}):q.order('created_at',{ascending:false});
  const {data,error}=await q; if(error)throw error;
  const sel=(n,opts)=>`<select id="f-${n}" class="w-full border rounded-lg p-2 text-sm bg-white">${opts.map(([v,l])=>`<option value="${v}" ${f[n]===v?'selected':''}>${l}</option>`).join('')}</select>`;
  app.innerHTML=`<div class="grid md:grid-cols-[220px_1fr] gap-6">
    <button id="ftg" type="button" class="md:hidden flex items-center justify-between w-full bg-white rounded-2xl px-4 py-3 text-sm font-semibold border border-gray-100 shadow-sm">Filters &amp; Sort <span>▾</span></button>

    <label class="block text-xs font-medium">Door no, street, area<textarea id="a-line" required rows="2" class="mt-1 w-full border rounded-xl p-2.5 text-sm outline-none">${esc(saved.line||'')}</textarea></label>

    <button id="po" class="${btn} w-full"></button></form>
   <aside class="bg-white border border-gray-100 rounded-3xl p-5 h-fit text-sm space-y-1 shadow-sm">${L.map(l=>`<div class="flex justify-between gap-2"><span>${esc(l.p.name)} × ${l.qty}</span><span>${inr(l.p.price*l.qty)}</span></div>`).join('')}
    <div class="flex gap-2 pt-3"><input id="cp" value="${esc(coupon)}" placeholder="Coupon code" class="border rounded-xl p-2.5 flex-1 uppercase"><button type="button" id="cpb" class="bg-gray-100 px-3 rounded-xl font-semibold">Apply</button></div>

    <div class="flex justify-between text-emerald-700"><span>Discount</span><span id="sd"></span></div>
    <div class="flex justify-between"><span>Delivery</span><span class="text-emerald-700 font-semibold">FREE</span></div>
    <div class="flex justify-between font-bold text-base border-t pt-2"><span>Total</span><span id="st"></span></div></aside></div>`;
  const refresh=()=>{

      const b=ov.querySelector('#cO');b.disabled=true;b.textContent='Placing order…';

    };

}

}

async function ordersHtml(pf){
  const saved=store.get('orders')||[];
  const res=await Promise.all(saved.map(x=>sb.rpc('track_order',{p_code:x.code,p_phone:x.phone})));
  const dev=res.map(r=>r.data).filter(Boolean);
  const phone=pf?.phone||store.get('lookup')||'';
  let list=[];
  if(phone){
    const {data:rpcData}=await sb.rpc('track_orders_by_phone',{p_phone:phone});
    if(rpcData) list=rpcData;
    else {
      const {data:directData}=await sb.from('orders').select('*').eq('phone',phone).order('created_at',{ascending:false});
      if(directData) list=directData;
    }
  }
  dev.forEach(d=>{if(!list.some(o=>o.created_at===d.created_at))list.push(d)});
  list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  OC={list,dev};

  const chips=[
    ['all','All'],
    ['delivered','Delivered'],
    ['pending','Pending Payment'],
    ['verified','Processing'],
    ['dispatched','Shipped']
  ];

  return `
  <div class="max-w-md mx-auto space-y-4 my-2">
    <!-- Header -->
    <div class="flex items-center justify-between px-1">
      <button onclick="location.hash='#/account/hub'" class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-gray-700 shadow-sm border border-gray-100">

      </button>
      <h1 class="text-2xl font-black text-gray-900">My Orders</h1>
      <button onclick="const q=prompt('Enter 10-digit Phone:');if(q){store.set('lookup',q.trim());route();}" class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-gray-700 shadow-sm border border-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
    </div>

    ${pf?'':`
      <form id="tf" class="bg-white border border-gray-100 rounded-2xl p-3 flex gap-2 shadow-sm">
        <input id="tp" required maxlength="10" inputmode="numeric" placeholder="Enter mobile number to view orders" value="${esc(phone)}" class="flex-1 border-0 bg-gray-50 rounded-xl px-3 py-2 text-xs outline-none">
        <button class="bg-slate-900 text-white text-xs px-4 rounded-xl font-bold">Track</button>
      </form>`
    }

    <!-- Pills Filter -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
      ${chips.map(c=>`
        <button data-f="${c[0]}" class="shrink-0 px-4 py-2 rounded-full text-xs font-bold transition ${ofilter===c[0]?'bg-slate-900 text-white shadow-sm':'bg-white text-gray-600 hover:bg-gray-100 border border-gray-100'}">
          ${c[1]}
        </button>
      `).join('')}
    </div>

    <!-- Cards -->
    <div class="space-y-4 pt-1">
      ${list.filter(GRP[ofilter]||GRP.all).map(orderCardSecondImage).join('')||`
        <div class="bg-white rounded-3xl p-10 text-center text-gray-400 text-xs border border-gray-100 shadow-sm">
          No orders found in this category.
        </div>`
      }
    </div>
  </div>`;
}

  let wp=[];if(wish.size){const {data}=await sb.from('products').select('*').in('id',[...wish]);wp=data||[]}
  return `
  <div class="max-w-4xl mx-auto space-y-4 my-2">
    <div class="flex items-center justify-between px-1">
      <button onclick="location.hash='#/account/hub'" class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-gray-700 shadow-sm border border-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h2 class="font-extrabold text-lg text-gray-900">My Wishlist (${wp.length})</h2>
      <div class="w-9"></div>
    </div>
    ${wp.length?grid(wp):'<div class="bg-white rounded-3xl p-12 text-center text-gray-400 text-xs border">Your wishlist is empty.</div>'}
  </div>`;
}

async function account(section, params){
  const pf=store.get('profile');
  if(!pf&&section!=='orders'&&section!=='hub'&&section!=='order-detail'){location.hash='#/login';return}

  if(section==='order-detail'){
    const oid=params.get('id');
    await orderDetailView(oid);
    return;
  }

  let body='';
  if(section==='hub'||!section) body=profileHubHtml(pf);
  else if(section==='orders') body=await ordersHtml(pf);
  else if(section==='profile') body=profileHtml(pf);
  else if(section==='addresses') body=addressesHtml();
  else if(section==='wishlist') body=await wishHtml();

  app.innerHTML=body;

  const tf=$('#tf');
  if(tf)tf.onsubmit=e=>{
    e.preventDefault();const v=$('#tp').value.trim();
    if(!/^[6-9]\d{9}$/.test(v))return toast('Enter a valid 10-digit mobile number');
    store.set('lookup',v);account(section, params);
  };

  app.onclick=async e=>{
    const t=e.target,d=t.dataset,again=()=>account(section, params);
    if(t.id==='lgo'){localStorage.removeItem('profile');setNav();toast('Logged out');location.hash='#/';return}
    if(d.f){ofilter=d.f;again()}
    if(t.id==='ps'){
      const name=$('#pn').value.trim(),phone=$('#pp').value.trim();
      if(name.length<2)return toast('Enter your name');
      if(!/^[6-9]\d{9}$/.test(phone))return toast('Enter a valid mobile number');
      store.set('profile',{name,phone});localStorage.removeItem('lookup');setNav();toast('Saved ✓');
      location.hash='#/account/hub';
    }
    if(t.id==='addA'){addrEdit={};again()}
    if(d.ae){addrEdit=getAddrs().find(x=>x.id===d.ae);again()}
    if(d.ad&&confirm('Delete this address?')){store.set('addrs',getAddrs().filter(x=>x.id!==d.ad));again()}
    if(d.adef){store.set('addrs',getAddrs().map(x=>({...x,def:x.id===d.adef})));again()}
    if(t.id==='acn'){addrEdit=null;again()}
    if(t.id==='asv'){
      const n={name:$('#a-name').value.trim(),phone:$('#a-phone').value.trim(),pincode:$('#a-pin').value.trim(),city:$('#a-city').value.trim(),state:$('#a-state').value.trim(),line:$('#a-line').value.trim()};
      if(!n.name||!n.city||!n.state||!n.line)return toast('Please fill all fields');
      if(!/^[6-9]\d{9}$/.test(n.phone))return toast('Enter a valid mobile number');
      if(!/^[1-9]\d{5}$/.test(n.pincode))return toast('Enter a valid 6-digit pincode');
      let L=getAddrs();
      if(addrEdit.id){n.id=addrEdit.id;n.def=addrEdit.def;L=L.map(x=>x.id===n.id?n:x)}else{n.id=Date.now().toString(36);n.def=!L.length;L.push(n)}
      store.set('addrs',L);addrEdit=null;toast('Address saved ✓');again();
    }
  };
}

/* ===== ROUTER ===== */
async function route(){
  app.onclick=null;clearInterval(window._bt);document.title=SET.brand.name+' | '+SET.brand.tagline;
  const [path,qs]=(location.hash||'#/').slice(1).split('?'), params=new URLSearchParams(qs||'');
  app.innerHTML='<p class="text-center text-gray-500 py-20">ஏற்றப்படுகிறது…</p>';
  $('#tabbar').classList.toggle('hidden',path.startsWith('/p/')||path==='/checkout');
  document.querySelectorAll('.tb').forEach(a=>{const on=a.dataset.tb.split('|').some(k=>k==='/'?(path==='/'||path===''):path.startsWith(k));a.style.color=on?'var(--p)':'#9ca3af'});
  try{
    if(path==='/'||path==='')await home();
    else if(path==='/shop')await shop(params);
    else if(path.startsWith('/p/'))await product(path.slice(3));
    else if(path==='/cart')await cartView();
    else if(path==='/checkout')await checkout();
    else if(path.startsWith('/account'))await account(path.split('/')[2]||'hub', params);
    else if(path==='/login')loginView();
    else app.innerHTML='<p class="text-center py-20">Page not found.</p>';
  }catch(err){console.error(err);app.innerHTML='<p class="text-center text-red-600 py-20">Error: '+esc(err.message||err)+'</p>'}
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b){e.preventDefault();e.stopPropagation();toggleWish(b.dataset.w)}},true);
$('#sf').onsubmit=e=>{e.preventDefault();location.hash='#/shop?q='+encodeURIComponent($('#q').value.trim())};
$('#sf2').onsubmit=e=>{e.preventDefault();location.hash='#/shop?q='+encodeURIComponent($('#q2').value.trim());$('#msearch').classList.add('hidden')};
$('#msb').onclick=()=>{$('#msearch').classList.toggle('hidden');$('#q2').focus()};
window.addEventListener('hashchange',route);
saveCart();Promise.all([initAuth(),loadSettings()]).then(route);
</script>
