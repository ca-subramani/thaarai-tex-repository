<style>
html,body{overflow-x:hidden;max-width:100%}
body{font-family:'Plus Jakarta Sans','Noto Sans Tamil',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;background-color:#f8fafc}

h1,h2,h3,p,label,td,li{overflow-wrap:anywhere}
.text-xs,.text-sm,.text-base,.text-lg,.text-xl{line-height:1.65!important}
.text-\[10px\],.text-\[11px\]{line-height:1.5!important}
.text-2xl,.text-3xl,.text-4xl{line-height:1.3!important}
.line-clamp-1,.line-clamp-2{line-height:1.6!important}
input,select,textarea{font-size:16px!important}
.rounded-2xl{border-radius:1.25rem!important}
.rounded-3xl{border-radius:1.75rem!important}
.shadow-soft{box-shadow:0 10px 30px -5px rgba(0,0,0,0.05),0 4px 12px -2px rgba(0,0,0,0.02)!important}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
#brand{max-width:55vw;overflow:hidden;cursor:pointer}
.checkmark-circle{stroke-dasharray:166;stroke-dashoffset:166;stroke-width:2.5;stroke-miterlimit:10;stroke:#10b981;fill:none;animation:stroke .6s cubic-bezier(.65,0,.45,1) forwards}
.checkmark{width:76px;height:76px;border-radius:50%;display:block;stroke-width:3;stroke:#10b981;stroke-miterlimit:10;margin:0 auto;box-shadow:inset 0 0 0 #10b981;animation:fill .4s ease-in-out .4s forwards,scale .3s ease-in-out .9s both}
.checkmark-check{transform-origin:50% 50%;stroke-dasharray:48;stroke-dashoffset:48;animation:stroke .3s cubic-bezier(.65,0,.45,1) .8s forwards}
@keyframes stroke{100%{stroke-dashoffset:0}}
@keyframes scale{0%,100%{transform:none}50%{transform:scale3d(1.1,1.1,1)}}
@keyframes fill{100%{box-shadow:inset 0 0 0 38px rgba(16,185,129,.12)}}
.lens-zoom-container{position:relative;overflow:hidden;cursor:default;touch-action:pan-y}
#hd-lightbox{touch-action:pan-y}

/* Smooth hero model cutout blend */
.hero-model-cutout {
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 82%, rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 82%, rgba(0,0,0,0) 100%);
  object-fit: contain;
  pointer-events: none;
}

/* Toast Checkmark using exact same animation as Order Placed */
.toast-checkmark {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: block;
  stroke-width: 3.5;
  stroke: #10b981;
  stroke-miterlimit: 10;
  box-shadow: inset 0 0 0 #10b981;
  animation: fill .4s ease-in-out .35s forwards, scale .3s ease-in-out .75s both;
  flex-shrink: 0;
}
.toast-checkmark-circle {
  stroke-dasharray: 166;
  stroke-dashoffset: 166;
  stroke-width: 3.5;
  stroke-miterlimit: 10;
  stroke: #10b981;
  fill: none;
  animation: stroke .5s cubic-bezier(.65,0,.45,1) forwards;
}
.toast-checkmark-check {
  transform-origin: 50% 50%;
  stroke-dasharray: 48;
  stroke-dashoffset: 48;
  stroke-width: 4.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke: #10b981;
  animation: stroke .3s cubic-bezier(.65,0,.45,1) .55s forwards;
}

/* Chrome-Style Black & Green Neon Loading Line */
#neon-loader {
  transition: opacity 0.22s ease-out, visibility 0.22s ease-out;
}
.tt-neon-bar {
  background: linear-gradient(90deg, #090d16 0%, #059669 45%, #10b981 80%, #34d399 100%);
  box-shadow: 0 0 10px rgba(16, 185, 129, 0.75), 0 0 4px rgba(5, 150, 105, 0.5);
  will-change: width;
}

/* Full-screen Brand Splash Screen */
#tt-splash {
  background: #000000;
  transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.4s ease-out;
}
#tt-splash.tt-splash-hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
@keyframes ttMonoT1 {
  0% { opacity: 0; transform: scale(0.9); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes ttMonoT2 {
  0%, 10% { opacity: 0; transform: scale(0.9); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes ttWordPart1 {
  0% { max-width: 0.35em; opacity: 0; }
  100% { max-width: 5.5em; opacity: 1; }
}
@keyframes ttWordPart2 {
  0% { max-width: 0; opacity: 0; }
  100% { max-width: 2.2em; opacity: 1; }
}
@keyframes ttSilkThread {
  0% { opacity: 0; transform: scaleX(0); filter: drop-shadow(0 0 0 rgba(16,185,129,0)); }
  45% { opacity: 1; filter: drop-shadow(0 0 12px rgba(52,211,153,0.95)); }
  100% { opacity: 1; transform: scaleX(1); filter: drop-shadow(0 0 4px rgba(16,185,129,0.5)); }
}
.tt-sp-t1, .tt-sp-t2, .tt-sp-p1, .tt-sp-p2, .tt-sp-thread { opacity: 0; }
.tt-sp-p1, .tt-sp-p2 {
  display: inline-block;
  overflow: hidden;
  white-space: pre;
  vertical-align: bottom;
}
.tt-sp-p1 { max-width: 0.35em; }
.tt-sp-p2 { max-width: 0; }
.tt-sp-thread { transform-origin: center; transform: scaleX(0); }
#tt-splash.tt-sp-play .tt-sp-t1 { animation: ttMonoT1 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
#tt-splash.tt-sp-play .tt-sp-t2 { animation: ttMonoT2 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
#tt-splash.tt-sp-play .tt-sp-p1 { animation: ttWordPart1 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards; }
#tt-splash.tt-sp-play .tt-sp-p2 { animation: ttWordPart2 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards; }
#tt-splash.tt-sp-play .tt-sp-thread { animation: ttSilkThread 1.0s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards; }
</style>
</head>

<div id="tt-splash" class="fixed inset-0 z-[99999] flex items-center justify-center px-6 text-center select-none touch-none">
  <div class="inline-flex flex-col items-center">
    <h1 class="inline-flex items-baseline text-white text-3xl sm:text-5xl font-extrabold tracking-tight leading-none" style="font-family:'Plus Jakarta Sans',system-ui,sans-serif">
      <span class="tt-sp-t1">T</span><span class="tt-sp-p1">haarai </span><span class="tt-sp-t2">T</span><span class="tt-sp-p2">ex</span>
    </h1>
    <div class="tt-sp-thread w-28 sm:w-40 h-[2.5px] mt-3 rounded-full bg-gradient-to-r from-emerald-600 via-emerald-400 to-emerald-600"></div>
  </div>
</div>
<script>
(function(){
  var el = document.getElementById('tt-splash');
  if(!el) return;
  var s = location.search || '', h = location.hash || '';
  var isPreview = (window.self !== window.top) || s.indexOf('adminPreview=1') !== -1;
  var isOAuth = s.indexOf('code=') !== -1 || h.indexOf('code=') !== -1 || h.indexOf('access_token=') !== -1 || h.indexOf('refresh_token=') !== -1;
  try {
    if(!isOAuth && sessionStorage.getItem('tt_oauth_pending') === '1') isOAuth = true;
    if(isPreview || isOAuth || sessionStorage.getItem('tt_splash_shown') === '1'){
      el.style.display = 'none';
      el.remove();
      return;
    }
    sessionStorage.setItem('tt_splash_shown', '1');
  } catch(e) {}
  var tc = document.querySelector('meta[name="theme-color"]');
  var origTc = tc ? tc.getAttribute('content') : '';
  document.documentElement.style.backgroundColor = '#000000';
  document.body.style.backgroundColor = '#000000';
  if(tc) tc.setAttribute('content', '#000000');
  var started = false;
  function startSplash(){
    if(started) return;
    started = true;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.classList.add('tt-sp-play');
        setTimeout(function(){
          document.documentElement.style.backgroundColor = '';
          document.body.style.backgroundColor = '';
          if(tc && origTc) tc.setAttribute('content', origTc);
          el.classList.add('tt-splash-hide');
          setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 450);
        }, 2100);
      });
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', startSplash, { once: true });
    setTimeout(startSplash, 600);
  } else {
    startSplash();
  }
})();
</script>
