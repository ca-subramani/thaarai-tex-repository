async function loadCartCloud(){
  try{
    const p = profile();
    if(!p) { cart = store.get('cart')||[]; saveCartBadge(); return; }
    if(sb){
      const {data} = await sb.rpc('get_user_cart', {p_phone: p.phone});
      cart = Array.isArray(data) ? data : (store.get('cart')||[]);
    } else {
      cart = store.get('cart')||[];
    }
  }catch{ cart = store.get('cart')||[]; }
  saveCartBadge();
}
async function saveCartCloud(){
  const p = profile();
  store.set('cart', cart);
  saveCartBadge();
  if(p && sb) {
    try{ await sb.rpc('save_user_cart', {p_phone: p.phone, p_items: cart}); }catch{}
  }
}

  if(!p){await loadCartCloud();return;}
  try{
    if(sb){
      const {data:cData}=await sb.rpc('get_user_cart',{p_phone:p.phone});
      if(cData&&Array.isArray(cData)){cart=cData;store.set('cart',cart);}
      else{await saveCartCloud();}
      const {data:wData}=await sb.rpc('get_wishlist',{p_phone:p.phone});
      (wData||[]).forEach(x=>wish.add(x));
    }
  }catch{}
  saveCartBadge();
  setNav();
}

}
function clearProfile(){

async function toggleWish(id){
  const p=profile();
  if(!p){toast('Login to save to your wishlist');location.hash='#/login';return}
  try{
    if(sb){
      const {data,error}=await sb.rpc('toggle_wishlist',{p_phone:p.phone,p_product:id});
      if(error)return toast('Could not update wishlist');
      data?wish.add(id):wish.delete(id);
    }
    document.querySelectorAll(`[data-w="${id}"]`).forEach(b=>{b.innerHTML=heart(wish.has(id))});
    if((location.hash||'').startsWith('#/account/wishlist'))route();
  }catch{toast('Could not update wishlist');}
}

/* ===== CART ===== */
function addCart(id,qty=1,max=10){
  const e=cart.find(i=>i.id===id);
  if(e){if(e.qty+qty>max)return toast('Max stock reached');e.qty+=qty}else cart.push({id,qty});
  saveCart();toast('Added to bag ✓');
}
async function cartLines(){
  if(!cart.length)return[];
  try{
    if(sb){
      const {data}=await sb.from('products').select('*').in('id',cart.map(i=>i.id));
      return cart.map(i=>({...i,p:(data||[]).find(p=>p.id===i.id)})).filter(l=>l.p);
    }
  }catch{}
  return [];
}
async function couponDiscount(sub){
  if(!coupon || !sb)return 0;
  try{
    const {data}=await sb.rpc('check_coupon',{p_code:coupon,p_subtotal:sub});
    return Number(data)||0;
  }catch{return 0;}
}

             b.className = 'filter-pill px-4 py-2 rounded-full border text-[11px] font-bold transition-colors duration-200 bg-white text-gray-600 border-gray-200 hover:bg-gray-50';
         });
         btn.className = 'filter-pill px-4 py-2 rounded-full border text-[11px] font-bold transition-colors duration-200 bg-slate-900 text-white border-slate-900';
         updateVarCallback(btn.dataset.val);
     });
  };
  
  setupPills('#cat-group', val => selectedCat = val);
  setupPills('#fab-group', val => selectedFab = val);

  const sortGroup = $('#sort-group');

    sortGroup.addEventListener('change', e => {

           selectedSort = e.target.value;

               const isChecked = lbl.querySelector('input').checked;
               const outer = lbl.querySelector('.border-2');
               const inner = lbl.querySelector('div > div');
               if(isChecked) {
                   outer.classList.replace('border-gray-300', 'border-emerald-500');
                   inner.classList.replace('scale-0', 'scale-100');
               } else {
                   outer.classList.replace('border-emerald-500', 'border-gray-300');
                   inner.classList.replace('scale-100', 'scale-0');
               }
           });
       }
    });
  }

  const executeFilter = () => {
     const p = new URLSearchParams();
     if(f.q) p.set('q', f.q);
     if(selectedCat) p.set('cat', selectedCat);
     if(selectedFab) p.set('fabric', selectedFab);
     const minv = $('#f-min').value.trim(); if(minv) p.set('min', minv);
     const maxv = $('#f-max').value.trim(); if(maxv) p.set('max', maxv);
     if(selectedSort) p.set('sort', selectedSort);
     if($('#f-stock').checked) p.set('stock', '1');
     location.hash = '#/shop?' + p.toString();
  };

  $('#sort-done').onclick=()=>{
    selectedSort=$('#sort-mobile input:checked')?.value||'new';
    $('#sort-sheet').classList.add('hidden');
    executeFilter();
  };
  $('#sort-reset').onclick=()=>{const recommended=$('#sort-mobile input[value="new"]');recommended.checked=true;};
  $('#apply').onclick = () => { closeFilters(); executeFilter(); };
  $('#f-reset').onclick = () => location.hash = '#/shop';
}

    let startDistance=0,startScale=1,scale=1,offsetX=0,offsetY=0,dragStart=null,baseX=0,baseY=0;
    const distance=touches=>Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
    const render=()=>{img.style.transform=`translate(${offsetX}px, ${offsetY}px) scale(${scale})`;onScale(scale)};

      if(e.touches.length===2){startDistance=distance(e.touches);startScale=scale;dragStart=null}
      else if(e.touches.length===1&&scale>1){dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY};baseX=offsetX;baseY=offsetY}
    },{passive:true});

      const rect=surface.getBoundingClientRect();

      else if(e.touches.length===1&&dragStart&&scale>1){e.preventDefault();const maxX=rect.width*(scale-1)/2,maxY=rect.height*(scale-1)/2;offsetX=Math.max(-maxX,Math.min(maxX,baseX+e.touches[0].clientX-dragStart.x));offsetY=Math.max(-maxY,Math.min(maxY,baseY+e.touches[0].clientY-dragStart.y));render()}
    },{passive:false});
    surface.addEventListener('touchend',e=>{if(e.touches.length<2)startDistance=0;if(e.touches.length===1&&scale>1){dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY};baseX=offsetX;baseY=offsetY}else if(!e.touches.length)dragStart=null},{passive:true});
    return()=>{scale=1;startScale=1;startDistance=0;offsetX=0;offsetY=0;dragStart=null;img.style.transform='translate(0px, 0px) scale(1)';img.style.transformOrigin='center center';onScale(1)};
  };
  const resetStageZoom=attachPinchZoom(stage,mainImg,value=>stageScale=value);
  const lb=$('#hd-lightbox'),lbImg=$('#lightbox-img'),resetLightboxZoom=attachPinchZoom(lb,lbImg),closeLb=()=>{lb.classList.add('hidden');resetLightboxZoom()};

    out.className='text-[11px] mt-1.5 font-bold text-emerald-700';
  };
}

  function confirmBox(addr,utr){

      <div class="flex justify-between text-xs"><span>Delivery</span><b class="text-emerald-700">FREE</b></div>
      <div class="flex justify-between font-extrabold text-sm border-t pt-2"><span>${method==='UPI'?'Amount paid':'Amount to pay on delivery'}</span><span class="text-emerald-700">${inr(sub-d)}</span></div>
      <div class="flex gap-2 pt-2"><button id="cE" class="flex-1 border border-gray-200 rounded-full py-3 text-xs font-bold text-gray-700 flex items-center justify-center">${ICONS.edit}Edit</button><button id="cO" class="flex-1 ${btn} !py-3 text-xs">Confirm Order</button></div></div>`;
    document.body.appendChild(ov);

    ov.querySelector('#cO').onclick=async()=>{
      const b=ov.querySelector('#cO');b.disabled=true;b.textContent='Placing order…';
      try{
        if(!sb) throw new Error('Database connection missing');
        const {data:orderId,error}=await sb.rpc('place_order_guest',{p_items:cart.map(i=>({id:i.id,qty:i.qty})),p_address:addr,p_coupon:coupon||null,p_method:method,p_ref:utr||null});
        if(error){toast(error.message);b.disabled=false;b.textContent='Confirm Order';return}
        const owner=profile()?.phone||addr.phone;
        await sb.rpc('set_order_account',{p_id:orderId,p_account:owner});
        if(!profile())await setProfile(addr.name,addr.phone);
        {const L2=await getAddrs();if(!L2.some(x=>x.line===addr.line&&x.pincode===addr.pincode))await setAddrs([...L2,{...addr,id:Date.now().toString(36),def:!L2.length}])}
        cart=[];saveCart();OC={list:[]};ov.remove();
        app.innerHTML=`<div class="max-w-md mx-auto text-center py-12 px-6 bg-white rounded-3xl shadow-soft border border-gray-100 my-4 space-y-4">
          <div class="py-2"><svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52"><circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/><path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/></svg></div>

          <p class="text-xs text-gray-500 leading-relaxed max-w-xs mx-auto">உங்கள் ஆர்டர் வெற்றிகரமாகப் பதிவானது. ஆர்டர் எண்: <span class="font-mono font-bold text-gray-900">#${esc(String(orderId).slice(0,8).toUpperCase())}</span>${method==='UPI'?'<br><span class="text-emerald-700 font-semibold">We will verify your payment shortly.</span>':''}</p>
          <div class="pt-4 flex gap-2"><a href="#/account/orders" class="${btn} flex-1 !py-3">My Orders</a><a href="#/shop" class="border border-gray-200 hover:border-slate-900 text-gray-800 text-xs font-bold px-6 py-3 rounded-full transition flex-1">Shop More</a></div></div>`;
      }catch(err){toast(err.message||'Error placing order');b.disabled=false;b.textContent='Confirm Order';}
    };
  }
}

const STL={pending:'text-slate-700 font-bold bg-slate-100 px-3 py-1 rounded-full',verified:'text-sky-700 font-bold bg-sky-50 px-3 py-1 rounded-full',dispatched:'text-purple-700 font-bold bg-purple-50 px-3 py-1 rounded-full',delivered:'text-emerald-700 font-bold bg-emerald-50 px-3 py-1 rounded-full',cancelled:'text-rose-700 font-bold bg-rose-50 px-3 py-1 rounded-full'};
const SLBL={pending:'Pending',verified:'Processing',dispatched:'Shipped',delivered:'Delivered',cancelled:'Cancelled'};
const GRP={all:()=>true,pending:o=>o.order_status==='pending',verified:o=>o.order_status==='verified',dispatched:o=>o.order_status==='dispatched',delivered:o=>o.order_status==='delivered',cancelled:o=>o.order_status==='cancelled'};
const PAYLBL={COD:'Cash on Delivery',UPI:'UPI'};

async function fetchOrders(){
  const p=profile();if(!p)return[];
  try{
    if(sb){
      const {data,error}=await sb.rpc('my_orders',{p_phone:p.phone});
      if(error)throw new Error(error.message);
      OC={list:data||[]};return OC.list;
    }
  }catch{}
  return [];
}

    <div class="bg-white rounded-3xl p-5 shadow-soft border border-gray-100 space-y-3"><h3 class="font-extrabold text-xs text-gray-900 uppercase tracking-wider">Ordered products (${items.length})</h3>
      <div class="divide-y divide-gray-100">${items.map(i=>{const productId=i.product_id??i.id, productHref=productId!==undefined&&productId!==null?'#/p/'+encodeURIComponent(productId):'';return `<div class="py-3 flex items-center gap-3.5"><a ${productHref?`href="${productHref}"`:''} class="shrink-0 ${productHref?'cursor-pointer':''}"><img src="${esc(i.image||'https://placehold.co/100x120?text=Saree')}" alt="${esc(i.name||'Ordered saree')}" class="w-16 h-20 object-cover rounded-2xl bg-gray-50 border"></a><div class="flex-1 min-w-0"><${productHref?'a href="'+productHref+'"':'span'} class="font-bold text-xs text-gray-900 line-clamp-2 block">${esc(i.name||'Saree')}</${productHref?'a':'span'}><p class="text-[11px] text-gray-500 mt-1">Unit price: ${inr(i.price)} · Quantity: ${i.quantity||1}</p><b class="text-xs text-slate-900 mt-1 block">${inr(Number(i.price||0)*Number(i.quantity||1))}</b></div></div>`}).join('')}</div></div>
    <div class="bg-white rounded-3xl p-5 shadow-soft border border-gray-100 space-y-2 text-xs"><h3 class="font-extrabold text-gray-900 uppercase tracking-wider text-[11px]">Delivery address</h3>${recipient?`<p class="font-bold text-gray-900">${esc(recipient)}</p>`:''}${phone?`<p class="text-gray-700">Mobile: <a href="tel:${esc(phone)}" class="font-semibold underline">${esc(phone)}</a></p>`:''}${addressLine?`<p class="text-gray-700 leading-relaxed">${esc(addressLine)}</p>`:''}<p class="text-gray-700">${esc([city,state].filter(Boolean).join(', '))}${pincode?' - '+esc(pincode):''}</p></div>
    <div class="bg-white rounded-3xl p-5 shadow-soft border border-gray-100 space-y-2 text-xs"><h3 class="font-extrabold text-gray-900 uppercase tracking-wider text-[11px]">Payment summary</h3>
      <div class="flex justify-between text-gray-600 pt-1"><span>Payment method</span><b class="text-gray-900">${esc(PAYLBL[ord.payment_method]||ord.payment_method||'')}</b></div>
      ${ord.coupon?`<div class="flex justify-between text-gray-600"><span>Coupon</span><b class="text-gray-900">${esc(ord.coupon)}</b></div>`:''}
      ${ord.discount?`<div class="flex justify-between text-gray-600"><span>Discount</span><b class="text-emerald-700">−${inr(ord.discount)}</b></div>`:''}
      <div class="flex justify-between text-gray-600"><span>Delivery</span><b class="text-emerald-700">FREE</b></div>
      <div class="flex justify-between text-sm font-extrabold text-slate-900 border-t pt-2.5 mt-2"><span>Total</span><span>${inr(ord.total)}</span></div></div>
    <div class="text-center pt-2"><a href="https://wa.me/${esc(WHATSAPP)}?text=${encodeURIComponent('Hi, I need help with my order #'+shortNo)}" target="_blank" rel="noopener" class="text-xs font-bold text-emerald-700 hover:underline inline-flex items-center gap-1">${ICONS.whatsapp}<span>Contact support on WhatsApp</span></a></div></div>`;
}

function profileHtml(pf){
  return `<div class="max-w-md mx-auto bg-white rounded-3xl p-6 shadow-soft border border-gray-100 my-2">
    <div class="flex items-center justify-between pb-4 border-b"><button onclick="location.hash='#/account/hub'" aria-label="Back" class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-600 hover:bg-gray-100">${ICONS.back}</button><h2 class="font-extrabold text-sm text-gray-900">Edit Profile</h2><div class="w-8"></div></div>
    <div class="space-y-4 mt-4">
      ${input('pn','Full Name',`maxlength="60" value="${esc(pf.name)}"`)}
      ${input('pp','Mobile Number (10 digits)',`maxlength="10" inputmode="numeric" value="${esc(pf.phone)}"`)}
      <p class="text-[11px] text-gray-400">Orders, wishlist, cart and addresses are saved against your mobile number.</p>
      <button id="ps" class="${btn} w-full mt-2">Save Changes</button></div></div>`;
}

async function addressesHtml(){
  const L=await getAddrs(), a=addrEdit;
  return `<div class="max-w-md mx-auto space-y-4 my-2">
    ${topbar('Shopping Address','#/account/hub')}
    ${a?`<div class="bg-white rounded-3xl p-5 shadow-soft border border-gray-100 space-y-3"><b class="text-xs block text-gray-900 font-extrabold">${a.id?'Edit':'Add New'} Address</b>
      ${input('a-name','Full name',`value="${esc(a.name||'')}"`)}${input('a-phone','Mobile number',`maxlength="10" value="${esc(a.phone||profile()?.phone||'')}"`)}${input('a-pin','Pincode',`maxlength="6" value="${esc(a.pincode||'')}"`)}
      <div class="grid grid-cols-2 gap-2">${input('a-city','City',`value="${esc(a.city||'')}"`)}${input('a-state','State',`value="${esc(a.state||'Tamil Nadu')}"`)}</div>
      <label class="block text-xs font-semibold text-gray-700">Door no, street, area<textarea id="a-line" rows="2" class="mt-1 w-full border border-gray-200 rounded-2xl p-2.5 text-xs outline-none">${esc(a.line||'')}</textarea></label>
      <div class="flex gap-2 pt-2"><button id="asv" class="${btn} flex-1 !py-3">Save</button><button id="acn" class="px-5 py-2.5 border rounded-full text-xs font-bold">Cancel</button></div></div>`
    :`<button id="addA" class="bg-white border-2 border-dashed border-gray-300 hover:border-slate-900 rounded-3xl w-full py-3.5 font-bold text-xs text-slate-900 transition shadow-soft">+ Add New Address</button>`}
    <div class="space-y-3">${L.map(x=>`<div class="bg-white rounded-3xl p-4 shadow-soft border border-gray-100 text-xs"><div class="flex items-center justify-between"><b class="text-gray-900">${esc(x.name)}</b>${x.def?'<span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">DEFAULT</span>':''}</div>
      <p class="text-gray-500 mt-1">${esc(x.phone)}</p><p class="text-gray-700 mt-1 leading-relaxed">${esc(x.line)}, ${esc(x.city)}, ${esc(x.state)} - <b>${esc(x.pincode)}</b></p>
      <div class="mt-3 pt-2 border-t flex gap-4 font-bold text-[11px]"><button data-ae="${esc(x.id)}" class="text-slate-900 underline flex items-center">${ICONS.edit}Edit</button><button data-ad="${esc(x.id)}" class="text-rose-600 underline">Delete</button>${x.def?'':`<button data-adef="${esc(x.id)}" class="text-gray-400 underline ml-auto">Set as Default</button>`}</div></div>`).join('')||(a?'':'<p class="text-center text-xs text-gray-400 py-8">No saved addresses.</p>')}</div></div>`;
}

async function wishHtml(){
  let wp=[];if(wish.size){try{const {data}=await sb.from('products').select('*').in('id',[...wish]);wp=data||[]}catch{}}
  return `<div class="max-w-4xl mx-auto space-y-4 my-2">${topbar('My Wishlist ('+wp.length+')','#/account/hub')}
    ${wp.length?grid(wp):'<div class="bg-white rounded-3xl p-12 text-center text-gray-400 text-xs border border-gray-100 shadow-soft">Your wishlist is empty.</div>'}</div>`;
}

async function account(section,params){
  const pf=profile();
  if(!pf&&section!=='orders'&&section!=='order-detail'){location.hash='#/login';return}
  if(section==='order-detail'){await orderDetailView(params.get('id')||'',pf);return}
  let body='';
  if(section==='orders')body=await ordersHtml(pf);
  else if(section==='profile')body=profileHtml(pf);
  else if(section==='addresses')body=await addressesHtml();
  else if(section==='wishlist')body=await wishHtml();
  else body=hubHtml(pf);
  app.innerHTML=body;
  app.onclick=async e=>{
    const t=e.target,d=t.dataset,again=()=>account(section,params);
    if(t.id==='lgo'){clearProfile();toast('Logged out');location.hash='#/';return}
    if(d.f){ofilter=d.f;again()}
    if(t.id==='ps'){
      const name=$('#pn').value.trim(),phone=$('#pp').value.trim();
      if(name.length<2)return toast('Enter your name');
      if(!/^[6-9]\d{9}$/.test(phone))return toast('Enter a valid mobile number');
      await setProfile(name,phone);toast('Saved ✓');location.hash='#/account/hub'}
    if(t.id==='addA'){addrEdit={};again()}
    if(d.ae){const L=await getAddrs();addrEdit=L.find(x=>x.id===d.ae);again()}
    if(d.ad&&confirm('Delete this address?')){let L=await getAddrs();await setAddrs(L.filter(x=>x.id!==d.ad));again()}
    if(d.adef){let L=await getAddrs();await setAddrs(L.map(x=>({...x,def:x.id===d.adef})));again()}
    if(t.id==='acn'){addrEdit=null;again()}
    if(t.id==='asv'){
      const n={name:$('#a-name').value.trim(),phone:$('#a-phone').value.trim(),pincode:$('#a-pin').value.trim(),city:$('#a-city').value.trim(),state:$('#a-state').value.trim(),line:$('#a-line').value.trim()};
      if(!n.name||!n.city||!n.state||!n.line)return toast('Please fill all fields');
      if(!/^[6-9]\d{9}$/.test(n.phone))return toast('Enter a valid mobile number');
      if(!/^[1-9]\d{5}$/.test(n.pincode))return toast('Enter a valid 6-digit pincode');
      let L=await getAddrs();
      if(addrEdit.id){n.id=addrEdit.id;n.def=addrEdit.def;L=L.map(x=>x.id===n.id?n:x)}else{n.id=Date.now().toString(36);n.def=!L.length;L.push(n)}
      await setAddrs(L);addrEdit=null;toast('Address saved ✓');again()}
  };
}

/* ===== ROUTER ===== */
async function route(){
  app.onclick=null;if(window._bt)clearInterval(window._bt);document.title=(SET&&SET.brand)?(SET.brand.name+' | '+SET.brand.tagline):'Thaarai Tex';
  const [path,qs]=(location.hash||'#/').slice(1).split('?'), params=new URLSearchParams(qs||'');
  app.innerHTML='<p class="text-center text-gray-400 py-20 text-xs">ஏற்றப்படுகிறது…</p>';
  $('#tabbar').classList.toggle('hidden',path.startsWith('/p/')||path==='/checkout');
  document.querySelectorAll('.tb').forEach(a=>{const on=a.dataset.tb.split('|').some(k=>k==='/'?(path==='/'||path===''):path.startsWith(k));a.style.color=on?'var(--p)':'#94a3b8'});
  try{
    if(path==='/'||path==='')await home();
    else if(path==='/shop')await shop(params);
    else if(path.startsWith('/p/'))await product(path.slice(3));
    else if(path==='/cart')await cartView();
    else if(path==='/checkout')await checkout();
    else if(path.startsWith('/account'))await account(path.split('/')[2]||'hub',params);
    else if(path==='/login')loginView();
    else app.innerHTML='<p class="text-center py-20 text-xs text-gray-400">Page not found.</p>';
  }catch(err){console.error(err);app.innerHTML='<p class="text-center text-rose-600 py-20 text-xs">Error: '+esc(err.message||err)+'</p>';}
  window.scrollTo(0,0);
}
window.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey)e.preventDefault()},{passive:false});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','=','-','0'].includes(e.key))e.preventDefault()},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(b){e.preventDefault();e.stopPropagation();toggleWish(b.dataset.w)}},true);
$('#sf').onsubmit=e=>{e.preventDefault();location.hash='#/shop?q='+encodeURIComponent($('#q').value.trim())};
$('#sf2').onsubmit=e=>{e.preventDefault();location.hash='#/shop?q='+encodeURIComponent($('#q2').value.trim());$('#msearch').classList.add('hidden')};
$('#msb').onclick=()=>{$('#msearch').classList.toggle('hidden');$('#q2').focus()};
let routeStack=[location.hash||'#/'];
let exitApproved=false,exitFromPop=false;
const isHomeRoute=()=>!location.hash||location.hash==='#/'||location.hash==='#';
function armExitGuard(){if(!history.state?.exitGuard)history.pushState({exitGuard:true},'',location.href)}
function syncHomeGuard(){if(isHomeRoute())armExitGuard()}
window.addEventListener('hashchange',()=>{
  if(exitApproved)return;
  const next=location.hash||'#/';
  if(routeStack.length>1&&next===routeStack[routeStack.length-2])routeStack.pop();
  else if(next!==routeStack[routeStack.length-1])routeStack.push(next);
  route();
});
function showExitConfirm(fromPop=false){exitFromPop=fromPop;$('#exit-confirm').classList.remove('hidden');$('#exit-stay').focus()}
$('#exit-stay').onclick=()=>{$('#exit-confirm').classList.add('hidden');if(exitFromPop)armExitGuard();exitFromPop=false};
$('#exit-leave').onclick=()=>{const steps=exitFromPop?1:2;exitApproved=true;$('#exit-confirm').classList.add('hidden');history.go(-steps)};
window.addEventListener('popstate',event=>{
  if(exitApproved)return;
  const lastRoute=routeStack[routeStack.length-1]||'#/';
  if(isHomeRoute()&&(lastRoute==='#/'||lastRoute==='#')&&event.state?.exitGuard!==true){showExitConfirm(true);return}
});
$('#nav-back').onclick=()=>{
  if(isHomeRoute()){showExitConfirm(false);return}
  if(routeStack.length>1){history.back();return}
  location.hash='#/';
};
const originalRoute=route;
route=async function(){await originalRoute();syncHomeGuard()};
Promise.all([initAuth(),loadSiteSettings()]).then(route);
</script>
